<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InvolvED — Your skills. Your proof.</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1C3A8A;--teal:#1D9E75;
  --pri:#6D28D9;--pri2:#7C3AED;--pri3:#8B5CF6;
  --orange:#F97316;--orange2:#FB923C;
  --cyan:#0891B2;--cyan2:#06B6D4;
  --pink:#DB2777;--pink2:#EC4899;
  --green:#059669;--green2:#10B981;
  --amber:#D97706;--amber2:#F59E0B;
  --red:#DC2626;--red2:#EF4444;
  --bg:#F0EBFF;--bg2:#E8E0FF;--card:#fff;
  --text:#1E0F40;--muted:#7B6FA4;--border:#DDD6FE;
  --r:16px;--rsm:12px;--rxs:8px;
  --sh:0 2px 10px rgba(109,40,217,.09);
  --shmd:0 6px 24px rgba(109,40,217,.14);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;line-height:1.5}
#app{min-height:100vh;display:flex;flex-direction:column}

/* TOPBAR */
.topbar{background:linear-gradient(135deg,#4C1D95 0%,#5B21B6 60%,#4338CA 100%);color:#fff;padding:0 20px;height:62px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 3px 12px rgba(76,29,149,.35)}
.logo{font-size:21px;font-weight:900;letter-spacing:-.5px;flex-shrink:0}
.logo-t{color:var(--teal)}
.streak-chip{display:flex;align-items:center;gap:5px;background:rgba(251,191,36,.18);border:1.5px solid rgba(251,191,36,.35);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;color:#FDE68A;flex-shrink:0}
.streak-fire{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.xp-section{flex:1;max-width:220px;margin:0 8px}
.xp-label{font-size:10px;opacity:.75;margin-bottom:3px;display:flex;justify-content:space-between}
.xp-track{height:7px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--orange),var(--amber2));border-radius:4px;transition:width .6s cubic-bezier(.34,1.56,.64,1)}
.lvl-badge{background:linear-gradient(135deg,var(--orange),var(--amber2));color:#fff;font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;flex-shrink:0}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.user-chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border-radius:999px;padding:4px 14px 4px 4px}
.u-av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex-shrink:0}
.u-name{font-size:13px;font-weight:600}
.role-pill{font-size:10px;padding:2px 8px;border-radius:999px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.role-pill.member{background:rgba(16,185,129,.25);color:#6EE7B7}
.role-pill.officer{background:rgba(251,191,36,.25);color:#FDE68A}
.role-pill.advisor{background:rgba(167,139,250,.25);color:#DDD6FE}
.icon-btn{background:none;border:none;cursor:pointer;color:rgba(255,255,255,.6);font-size:18px;padding:4px;line-height:1;transition:color .15s}
.icon-btn:hover{color:#fff}

/* LAYOUT */
.app-body{display:flex;flex:1}
.sidebar{width:210px;flex-shrink:0;background:#fff;border-right:1px solid var(--border);padding:10px 0;height:calc(100vh - 62px);position:sticky;top:62px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:9px;padding:10px 16px;cursor:pointer;font-size:14px;font-weight:500;color:var(--muted);border-left:3px solid transparent;transition:all .15s;user-select:none}
.nav-item:hover{background:var(--bg);color:var(--text)}
.nav-item.active{color:var(--pri);border-left-color:var(--pri);background:#F5F0FF;font-weight:700}
.nav-icon{font-size:16px;width:20px;text-align:center}
.nav-dot{width:8px;height:8px;border-radius:50%;background:var(--red);margin-left:auto;flex-shrink:0}
.main{flex:1;overflow-y:auto;padding:24px 28px;max-width:1000px}

/* STAT CARDS */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:22px}
.stat-card{background:var(--card);border-radius:var(--r);padding:18px;border:1px solid var(--border);box-shadow:var(--sh);position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:-10px;right:-10px;width:60px;height:60px;border-radius:50%;opacity:.08}
.stat-val{font-size:30px;font-weight:900;line-height:1}
.stat-lbl{font-size:12px;color:var(--muted);margin-top:4px}
.stat-ico{font-size:20px;margin-bottom:6px}

/* SQUARE TASK CARDS */
.task-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-bottom:20px}
.tcard{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s;min-height:230px;border:1px solid var(--border)}
.tcard:hover{transform:translateY(-3px);box-shadow:var(--shmd)}
.tcard-top{height:6px}
.tcard-body{padding:14px;display:flex;flex-direction:column;flex:1}
.tcard-cat-row{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.tcard-cat-icon{font-size:20px}
.tcard-cat-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.tcard-title{font-size:14px;font-weight:800;line-height:1.35;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tcard-desc{font-size:12px;color:var(--muted);flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:10px}
.tcard-skills{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.tcard-footer{display:flex;align-items:center;justify-content:space-between;margin-top:auto;gap:6px}
.tcard-cap{font-size:11px;color:var(--muted);font-weight:600}

/* STATUS + SKILL CHIPS */
.s-chip{font-size:10px;padding:2px 8px;border-radius:999px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;flex-shrink:0}
.s-open{background:#EDE9FE;color:#5B21B6}
.s-claimed{background:#FEF3C7;color:#92400E}
.s-review{background:#E0F2FE;color:#0369A1}
.s-approved{background:#D1FAE5;color:#065F46}
.s-full{background:#F3F4F6;color:#4B5563}
.sk-tag{font-size:10px;padding:2px 7px;border-radius:999px;background:#EDE9FE;color:var(--pri);font-weight:600}
.xp-chip{font-size:11px;padding:3px 9px;border-radius:999px;background:linear-gradient(135deg,#FFF3E0,#FFE0B2);color:var(--orange);font-weight:800;border:1px solid #FECACA}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:var(--rsm);font-size:14px;font-weight:700;cursor:pointer;border:none;transition:all .15s;line-height:1;font-family:inherit}
.btn-pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 3px 10px rgba(109,40,217,.3)}
.btn-pri:hover{transform:translateY(-1px);box-shadow:0 5px 15px rgba(109,40,217,.35)}
.btn-teal{background:linear-gradient(135deg,var(--teal),var(--green2));color:#fff;box-shadow:0 3px 10px rgba(5,150,105,.25)}
.btn-teal:hover{transform:translateY(-1px)}
.btn-orange{background:linear-gradient(135deg,var(--orange),var(--amber2));color:#fff;box-shadow:0 3px 10px rgba(249,115,22,.3)}
.btn-orange:hover{transform:translateY(-1px)}
.btn-ghost{background:var(--bg);color:var(--text);border:1.5px solid var(--border)}
.btn-ghost:hover{background:var(--bg2)}
.btn-danger{background:#FEE2E2;color:var(--red)}
.btn-danger:hover{background:#FECACA}
.btn-ai{background:linear-gradient(135deg,#7C3AED,#DB2777);color:#fff;box-shadow:0 3px 10px rgba(124,58,237,.3)}
.btn-ai:hover{transform:translateY(-1px)}
.btn-sm{padding:6px 13px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none!important}

/* FILTER TABS */
.filter-row{display:flex;gap:4px;margin-bottom:18px;background:#fff;padding:4px;border-radius:var(--rsm);border:1px solid var(--border);width:fit-content}
.ftab{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:none;color:var(--muted);font-family:inherit;transition:all .15s}
.ftab.active{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.ftab:hover:not(.active){background:var(--bg);color:var(--text)}

/* BADGES */
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.badge-card{border-radius:var(--r);padding:18px 12px;text-align:center;border:2px solid var(--border);transition:all .2s;position:relative;overflow:hidden}
.badge-card.earned{border-color:transparent;animation:badgePop .4s cubic-bezier(.34,1.56,.64,1)}
.badge-icon-big{font-size:34px;margin-bottom:8px}
.badge-name{font-size:12px;font-weight:800;margin-bottom:3px}
.badge-desc{font-size:11px;color:var(--muted)}
.badge-card:not(.earned) .badge-icon-big{filter:grayscale(1);opacity:.3}
.badge-card:not(.earned) .badge-name{color:var(--muted)}
.earned-tick{font-size:10px;font-weight:800;margin-top:5px;color:#059669}
@keyframes badgePop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}

/* LEADERBOARD */
.lb-list{display:flex;flex-direction:column;gap:8px}
.lb-row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r);padding:14px 16px;border:1px solid var(--border);box-shadow:var(--sh)}
.lb-row.you{border-color:var(--pri3);background:linear-gradient(135deg,#F5F0FF,#FAF5FF)}
.rank{font-size:20px;font-weight:900;width:32px;text-align:center;color:var(--muted)}
.rank-1{color:#F59E0B}.rank-2{color:#9CA3AF}.rank-3{color:#CD7C2F}
.lb-av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff}
.lb-name{font-weight:700;font-size:15px}
.lb-sub{font-size:12px;color:var(--muted)}
.lb-xp{font-size:22px;font-weight:900;background:linear-gradient(135deg,var(--orange),var(--amber2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.lb-xplbl{font-size:10px;color:var(--muted)}

/* RESUME */
.skill-bank{display:flex;flex-wrap:wrap;gap:8px}
.skill-bank-tag{background:linear-gradient(135deg,#EDE9FE,#F5F0FF);color:var(--pri);border:1.5px solid var(--pri3);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700}
.pe-card{background:var(--card);border-radius:var(--r);padding:16px 18px;border:1px solid var(--border);margin-bottom:10px}
.pe-title{font-weight:800;margin-bottom:4px}
.pe-text{font-size:13px;color:var(--muted);margin-bottom:8px}
.pe-empty{font-size:13px;color:var(--pri3);font-style:italic;margin-bottom:8px}
.file-attached{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--cyan);font-weight:600;background:#ECFEFF;padding:4px 10px;border-radius:999px;cursor:pointer}

/* MEMBERS */
.member-list{display:flex;flex-direction:column;gap:10px}
.m-row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r);padding:14px 16px;border:1px solid var(--border);box-shadow:var(--sh)}
.m-av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:#fff;flex-shrink:0}
.m-name{font-weight:700;font-size:15px}
.m-sub{font-size:12px;color:var(--muted)}
.m-stats{margin-left:auto;display:flex;gap:18px}
.mstat{text-align:center}
.mstat-v{font-weight:900;font-size:17px;color:var(--pri)}
.mstat-l{font-size:10px;color:var(--muted)}

/* ATTENDANCE */
.att-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-bottom:20px}
.att-card{background:var(--card);border-radius:var(--r);padding:20px;border:1px solid var(--border);box-shadow:var(--sh)}
.att-card-open{border-color:var(--green2);background:linear-gradient(135deg,#F0FDF4,#ECFDF5)}
.att-event-name{font-size:16px;font-weight:800;margin-bottom:4px}
.att-event-meta{font-size:12px;color:var(--muted);margin-bottom:12px}
.att-code{display:inline-block;font-family:monospace;font-size:22px;font-weight:900;color:var(--pri);background:#EDE9FE;padding:8px 16px;border-radius:var(--rxs);letter-spacing:2px;margin-bottom:12px}
.qr-img{border-radius:var(--rxs);border:3px solid var(--border);display:block}
.att-count{font-size:13px;color:var(--muted);font-weight:600}
.checkin-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.checkin-chip{font-size:11px;padding:3px 9px;background:#D1FAE5;color:#065F46;border-radius:999px;font-weight:600}

/* CHECKIN (member) */
.event-list{display:flex;flex-direction:column;gap:10px}
.event-row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:var(--r);padding:14px 18px;border:1px solid var(--border);box-shadow:var(--sh)}
.event-open-row{border-color:var(--green2);background:linear-gradient(135deg,#F0FDF4,#ECFDF5)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(30,15,64,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;backdrop-filter:blur(4px)}
.modal{background:#fff;border-radius:var(--r);width:100%;max-width:540px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 70px rgba(76,29,149,.25);animation:slideUp .25s cubic-bezier(.34,1.56,.64,1)}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-hdr{padding:20px 22px 0;display:flex;align-items:center;justify-content:space-between}
.modal-ttl{font-size:18px;font-weight:800}
.modal-body{padding:18px 22px}
.modal-ftr{padding:0 22px 18px;display:flex;gap:8px;justify-content:flex-end}
.close-btn{background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}

/* FORMS */
.fg{margin-bottom:14px}
.fl{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:var(--text);text-transform:uppercase;letter-spacing:.4px}
.fi,.fta,.fsel{width:100%;padding:10px 14px;border:2px solid var(--border);border-radius:var(--rsm);font-size:14px;font-family:inherit;outline:none;transition:border-color .2s;background:#fff}
.fi:focus,.fta:focus,.fsel:focus{border-color:var(--pri)}
.fta{min-height:90px;resize:vertical}
.skill-picks{display:flex;flex-wrap:wrap;gap:6px;padding:10px;border:2px solid var(--border);border-radius:var(--rsm);background:var(--bg)}
.skill-pick-toggle{padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;border:2px solid var(--border);background:#fff;color:var(--muted);font-family:inherit;transition:all .15s}
.skill-pick-toggle.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.skill-pick-toggle:hover:not(.on){border-color:var(--pri);color:var(--pri)}
.ai-skill-chip{padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;border:2px solid var(--green2);background:#D1FAE5;color:#065F46;font-family:inherit;transition:all .15s}
.ai-skill-chip.off{background:#F3F4F6;color:var(--muted);border-color:var(--border)}
.file-input-wrap{border:2px dashed var(--border);border-radius:var(--rsm);padding:16px;text-align:center;cursor:pointer;transition:border-color .2s}
.file-input-wrap:hover{border-color:var(--pri)}
.file-input-wrap input{display:none}
.ai-suggestion-box{background:linear-gradient(135deg,#F5F0FF,#FDF2F8);border:1.5px solid var(--pri3);border-radius:var(--rsm);padding:14px;margin-top:10px;font-size:13px;line-height:1.6}
.ai-loading-row{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--pri3);animation:bounce 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:scale(.8);opacity:.5}40%{transform:scale(1.2);opacity:1}}

/* LOGIN */
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(140deg,#2E1065 0%,#4C1D95 45%,#1E3A8A 100%);padding:20px;position:relative;overflow:hidden}
.login-page::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 70%,rgba(109,40,217,.4),transparent 60%),radial-gradient(ellipse at 70% 20%,rgba(6,182,212,.25),transparent 50%)}
.login-card{background:#fff;border-radius:24px;padding:36px;width:100%;max-width:500px;box-shadow:0 30px 80px rgba(0,0,0,.35);position:relative;z-index:1}
.login-logo{font-size:34px;font-weight:900;letter-spacing:-1px;margin-bottom:4px}
.login-tagline{color:var(--muted);font-size:14px;margin-bottom:24px}
.login-section-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin-bottom:10px}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.pick-btn{display:flex;align-items:center;gap:10px;padding:12px;border:2px solid var(--border);border-radius:var(--rsm);cursor:pointer;transition:all .15s;background:#fff;font-family:inherit;text-align:left}
.pick-btn:hover{border-color:var(--pri);background:#F5F0FF}
.pick-av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;flex-shrink:0}
.pick-name{font-weight:700;font-size:13px}
.pick-role{font-size:11px;color:var(--muted);text-transform:capitalize}
.divider{height:1px;background:var(--border);margin:16px 0}
.or-text{text-align:center;font-size:12px;color:var(--muted);margin:14px 0;position:relative}
.or-text::before,.or-text::after{content:'';position:absolute;top:50%;width:44%;height:1px;background:var(--border)}
.or-text::before{left:0}.or-text::after{right:0}

/* FLOATING AI */
.ai-fab{position:fixed;bottom:22px;right:22px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pink));box-shadow:0 6px 20px rgba(109,40,217,.4);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:24px;z-index:900;transition:transform .2s,box-shadow .2s;border:none}
.ai-fab:hover{transform:scale(1.1);box-shadow:0 8px 28px rgba(109,40,217,.5)}
.ai-panel{position:fixed;bottom:90px;right:22px;width:340px;max-height:500px;background:#fff;border-radius:var(--r);box-shadow:0 20px 60px rgba(30,15,64,.25);z-index:900;display:none;flex-direction:column;overflow:hidden;border:1px solid var(--border);animation:slideUp .2s ease}
.ai-panel.open{display:flex}
.ai-ph{background:linear-gradient(135deg,var(--pri),var(--pink));padding:14px 16px;color:#fff;display:flex;align-items:center;justify-content:space-between}
.ai-ph-title{font-size:15px;font-weight:800}
.ai-ph-sub{font-size:11px;opacity:.8}
.ai-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;background:#FAFAFA}
.ai-msg{max-width:85%;padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.5}
.ai-msg.user{align-self:flex-end;background:var(--pri);color:#fff;border-bottom-right-radius:4px}
.ai-msg.ai{align-self:flex-start;background:#fff;color:var(--text);border:1px solid var(--border);border-bottom-left-radius:4px;box-shadow:var(--sh)}
.ai-msg-lbl{font-size:9px;font-weight:800;color:var(--pink);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.ai-ir{display:flex;gap:6px;padding:10px}
.ai-input{flex:1;padding:9px 13px;border:2px solid var(--border);border-radius:var(--rsm);font-size:13px;font-family:inherit;outline:none}
.ai-input:focus{border-color:var(--pri)}
.ai-chips-row{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px 8px}
.ai-chip{background:#fff;border:1.5px solid var(--border);border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s}
.ai-chip:hover{border-color:var(--pri);color:var(--pri)}
.api-key-area{padding:14px}
.api-key-banner{background:#FFF7ED;border:2px solid #FED7AA;border-radius:var(--rsm);padding:14px}

/* PAGE HEADERS */
.page-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;gap:12px}
.page-title{font-size:24px;font-weight:900;color:var(--pri);letter-spacing:-.3px}
.page-sub{font-size:13px;color:var(--muted);margin-top:3px}
.sec-title{font-size:16px;font-weight:800;color:var(--text);margin-bottom:12px}
.sec-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}

/* TOAST */
.toast-wrap{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:3000;display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none}
.toast{background:#1E0F40;color:#fff;padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:var(--shmd);animation:toastIn .3s cubic-bezier(.34,1.56,.64,1);pointer-events:all}
.toast.ok{background:linear-gradient(135deg,var(--green),var(--green2))}
.toast.err{background:linear-gradient(135deg,var(--red),var(--red2))}
@keyframes toastIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

/* XP FLOAT ANIM */
.xp-float{position:fixed;z-index:4000;font-size:20px;font-weight:900;color:var(--orange);pointer-events:none;animation:xpRise 1.4s ease-out forwards;text-shadow:0 2px 8px rgba(249,115,22,.4)}
@keyframes xpRise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-70px);opacity:0}}

/* EMPTY */
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty-ico{font-size:44px;margin-bottom:10px}
.empty-ttl{font-size:16px;font-weight:800;color:var(--text);margin-bottom:4px}

/* DASHBOARD STREAKS */
.streak-banner{background:linear-gradient(135deg,#7C2D12,#EA580C,#F97316);border-radius:var(--r);padding:18px 22px;color:#fff;margin-bottom:20px;display:flex;align-items:center;gap:16px}
.streak-num{font-size:42px;font-weight:900;line-height:1}
.streak-lbl{font-size:14px;opacity:.9;font-weight:600}
.daily-goal{background:var(--card);border-radius:var(--r);padding:16px 18px;border:1px solid var(--border);margin-bottom:20px}
.daily-goal-bar{height:10px;background:var(--bg2);border-radius:5px;margin-top:8px;overflow:hidden}
.daily-goal-fill{height:100%;background:linear-gradient(90deg,var(--orange),var(--amber2));border-radius:5px;transition:width .8s cubic-bezier(.34,1.56,.64,1)}

@media(max-width:768px){.sidebar{display:none}.main{padding:14px}.task-grid{grid-template-columns:1fr 1fr}.picks{grid-template-columns:1fr}}
</style>

function approvedByUser(uid){
  return S.tasks.flatMap(t=>t.submissions.filter(s=>s.userId===uid&&s.status==='approved').map(()=>t));
}

function taskStatus(t){
  const active=t.submissions.filter(s=>s.status!=='rejected');
  if(active.some(s=>s.status==='pending_review'))return 'review';
  if(active.length>=t.capacity)return 'full';
  if(active.length>0)return 'claimed';
  return 'open';
}
function mySubmission(t){return t.submissions.find(s=>s.userId===S.uid)}
function members(){return S.users.filter(u=>u.role==='member')}

function awardBadges(uid){
  const u=getUser(uid);if(!u)return[];
  const earned=[];const done=approvedByUser(uid);
  const cats=new Set(done.flatMap(t=>t.skills.map(s=>SKILL_CATS[s]).filter(Boolean)));
  const give=(id,cond)=>{if(cond&&!u.badges.includes(id)){u.badges.push(id);earned.push(id)}};
  give('first-step',done.length>=1);
  give('go-getter',done.length>=3);
  give('team-player',S.tasks.some(t=>t.submissions.some(s=>s.userId===uid)));
  give('all-rounder',cats.size>=3);
  give('researcher',done.some(t=>t.cat==='research'));
  give('creative',done.some(t=>t.cat==='creative'));
  if(u.role==='officer')give('leader',u.tasksApproved>=5);
  give('resume-ready',u.portfolioEntries.length>0);
  return earned;
}

  const active=task.submissions.filter(s=>s.status!=='rejected');

  let stChip='',action='';
  if(st==='open')stChip=`<span class="s-chip s-open">Open</span>`;
  else if(st==='claimed')stChip=`<span class="s-chip s-claimed">In Progress</span>`;
  else if(st==='review')stChip=`<span class="s-chip s-review">Needs Review</span>`;
  else if(st==='approved')stChip=`<span class="s-chip s-approved">Done</span>`;
  else stChip=`<span class="s-chip s-full">Full</span>`;

  if(u.role==='member'){
    if(!mySub&&st==='open')action=`<button class="btn btn-teal btn-sm" onclick="claimTask('${task.id}')">Claim</button>`;
    else if(mySub?.status==='claimed')action=`<button class="btn btn-pri btn-sm" onclick="openModal('submit','${task.id}')">Submit</button>`;
    else if(mySub?.status==='pending_review')action=`<button class="btn btn-ghost btn-sm" disabled>⏳ In Review</button>`;
    else if(mySub?.status==='approved')action=`<button class="btn btn-ghost btn-sm" onclick="openModal('portfolio','${task.id}')">+ Portfolio</button>`;
  }else if(u.role==='officer'){
    const reviewCount=task.submissions.filter(s=>s.status==='pending_review').length;
    if(reviewCount)action=`<button class="btn btn-pri btn-sm" onclick="openModal('review','${task.id}')">Review (${reviewCount})</button>`;
    else if(st==='open')action=`<button class="btn btn-danger btn-sm" onclick="delTask('${task.id}')">Delete</button>`;
  }

  return`<div class="tcard">
  <div class="tcard-top" style="background:${cat.c}"></div>
  <div class="tcard-body">
    <div class="tcard-cat-row">
      <span class="tcard-cat-icon">${cat.icon}</span>
      <span class="tcard-cat-lbl" style="color:${cat.c}">${cat.lbl}</span>
      <span style="margin-left:auto">${stChip}</span>
    </div>
    <div class="tcard-title">${task.title}</div>
    <div class="tcard-desc">${task.desc}</div>
    <div class="tcard-skills">${task.skills.map(s=>`<span class="sk-tag">${s}</span>`).join('')}</div>
    <div class="tcard-footer">
      <div>
        <span class="xp-chip">⚡${task.xp} XP</span>
        ${task.capacity>1?`<span class="tcard-cap" style="margin-left:6px">👥 ${spotsLeft}/${task.capacity} spots</span>`:''}
      </div>
      ${action}
    </div>
  </div>
</div>`;
}

// ── RENDER TASKS VIEW ─────────────────────────────────
function renderTasks(){
  const u=me();const f=S.filter;
  let tasks=[...S.tasks].sort((a,b)=>b.createdAt-a.createdAt);
  const pendingN=S.tasks.reduce((n,t)=>n+t.submissions.filter(s=>s.status==='pending_review').length,0);

  if(u.role==='member'){
    if(f==='open')tasks=tasks.filter(t=>taskStatus(t)==='open');
    else if(f==='mine')tasks=tasks.filter(t=>t.submissions.some(s=>s.userId===u.id));
  }else{
    if(f==='review')tasks=tasks.filter(t=>t.submissions.some(s=>s.status==='pending_review'));
    else if(f==='open')tasks=tasks.filter(t=>taskStatus(t)==='open');
    else if(f==='approved')tasks=tasks.filter(t=>t.submissions.some(s=>s.status==='approved'));
  }

  const filters=u.role==='member'
    ?[['all','All'],['open','Open'],['mine','My Tasks']]
    :[['all','All'],[`review`,`⏳ Review${pendingN?` (${pendingN})`:''}`],['open','Open'],['approved','Approved']];

  return`<div class="page-hdr">
  <div><div class="page-title">Tasks</div><div class="page-sub">${u.role==='member'?'Claim tasks to earn XP and real skills.':'Create tasks and review submissions.'}</div></div>
  ${u.role==='officer'?`<button class="btn btn-pri" onclick="openModal('createTask')">+ Create Task</button>`:''}
</div>
<div class="filter-row">${filters.map(([k,l])=>`<button class="ftab ${f===k?'active':''}" onclick="setF('${k}')">${l}</button>`).join('')}</div>
${tasks.length?`<div class="task-grid">${tasks.map(t=>taskCard(t)).join('')}</div>`:`<div class="empty"><div class="empty-ico">📭</div><div class="empty-ttl">Nothing here</div><div>Try a different filter.</div></div>`}`;
}

// ── MAIN RENDER ───────────────────────────────────────
function render(){
  const app=document.getElementById('app');
  if(!S.uid){app.innerHTML=renderLogin();document.getElementById('aiFab').style.display='none';return}
  document.getElementById('aiFab').style.display='flex';
  app.innerHTML=`${renderTopbar()}<div class="app-body">${renderSidebar()}<div class="main">${renderView()}</div></div>${renderModal()}`;
}

function renderView(){
  switch(S.view){
    case'dashboard': return renderDashboard();
    case'tasks':     return renderTasks();
    case'members':   return renderMembers();
    case'resume':    return renderResume();
    case'leaderboard':return renderLeaderboard();
    case'checkin':   return renderCheckin();
    case'attendance':return renderAttendance();
    default:         return '';
  }
}

// ── ACTIONS ───────────────────────────────────────────
function login(uid){S.uid=uid;S.view='dashboard';S.filter='all';render()}
function loginCustom(){
  const name=document.getElementById('cName').value.trim();
  const role=document.getElementById('cRole').value;
  if(!name){toast('Enter your name','err');return}
  const id='u'+Date.now();
  S.users.push({id,name,role,xp:0,skills:[],badges:[],portfolioEntries:[],tasksApproved:0,streak:0});
  login(id);
}
function logout(){S.uid=null;S.view='login';document.getElementById('aiPanel').classList.remove('open');render()}
function nav(v){S.view=v;S.filter='all';render()}
function setF(f){S.filter=f;render()}
function openModal(m,d=null){S.modal=m;S.modalData=d;S.pendingAISkills=[];S.modalAILoading=false;S.pendingFile=null;render()}
function closeModal(){S.modal=null;S.modalData=null;render()}

function claimTask(id){
  const t=S.tasks.find(t=>t.id===id);if(!t)return;
  const u=me();
  if(t.submissions.some(s=>s.userId===u.id)){toast('Already claimed','err');return}
  t.submissions.push({userId:u.id,status:'claimed',work:null,fileName:null,fileDataUrl:null,aiSkills:[]});
  u.streak=(u.streak||0)+1;
  const nb=awardBadges(u.id);
  toast('Task claimed! 💪','ok');
  if(nb.length)setTimeout(()=>openModal('badgeUnlocked',nb[0]),500);
  else render();
}

function handleFile(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    S.pendingFile={name:file.name,size:(file.size/1024).toFixed(0)+' KB',dataUrl:e.target.result};
    const lbl=document.getElementById('fileLbl');
    if(lbl)lbl.innerHTML=`✅ <strong>${file.name}</strong> (${S.pendingFile.size})`;
  };
  reader.readAsDataURL(file);
}

async function analyzeSkills(taskId){
  if(!S.apiKey||S.apiKey==='YOUR_GROQ_KEY_HERE'){toast('Add your Groq key to index.html','err');return}
  const work=document.getElementById('workText')?.value?.trim();
  if(!work){toast('Write a description first','err');return}
  const task=S.tasks.find(t=>t.id===taskId);
  S.modalAILoading=true;render();
  try{
    const res=await callGroq(
      `You analyze club project submissions and identify transferable skills. Return ONLY a comma-separated list of 3-6 specific skills demonstrated. No explanations. Example: Written Communication, Research, Data Analysis, Stakeholder Engagement`,
      `Task: ${task.title}\nDescription: ${task.desc}\nSubmission: ${work}`
    );
    S.pendingAISkills=res.split(',').map(s=>s.trim()).filter(Boolean);
  }catch(e){
    S.pendingAISkills=['Communication','Organization','Critical Thinking'];
    toast('Used fallback skills (check API key)','');
  }
  S.modalAILoading=false;render();
}

function submitWork(taskId){
  const work=document.getElementById('workText')?.value?.trim();
  if(!work){toast('Describe your work first','err');return}
  const t=S.tasks.find(t=>t.id===taskId);
  const sub=t.submissions.find(s=>s.userId===S.uid);
  if(!sub)return;
  const confirmedSkills=S.pendingAISkills.length
    ?[...document.querySelectorAll('.ai-skill-chip:not(.off)')].map(c=>c.textContent)
    :[];
  sub.status='pending_review';
  sub.work=work;
  sub.fileName=S.pendingFile?.name||null;
  sub.fileDataUrl=S.pendingFile?.dataUrl||null;
  sub.aiSkills=confirmedSkills;
  S.pendingFile=null;S.pendingAISkills=[];
  closeModal();toast('Submitted! Officer will review soon.','ok');
}

function approveSub(taskId,userId){
  const t=S.tasks.find(t=>t.id===taskId);
  const sub=t.submissions.find(s=>s.userId===userId);
  const claimer=getUser(userId);const officer=me();
  sub.status='approved';
  const prevLvl=lvl(claimer.xp);
  claimer.xp+=t.xp;
  claimer.streak=(claimer.streak||0)+1;
  // merge task skills + AI skills, deduplicate
  const allSkills=[...new Set([...t.skills,...(sub.aiSkills||[])])];
  allSkills.forEach(s=>{if(!claimer.skills.includes(s))claimer.skills.push(s)});
  officer.tasksApproved=(officer.tasksApproved||0)+1;
  const newLvl=lvl(claimer.xp);
  const nb=awardBadges(userId);awardBadges(officer.id);
  closeModal();
  showXPGain(t.xp);
  toast(`✅ Approved! ${claimer.name.split(' ')[0]} +${t.xp} XP${newLvl>prevLvl?' · LEVEL UP! 🎉':''}`, 'ok');
  if(nb.length)setTimeout(()=>openModal('badgeUnlocked',nb[0]),800);
}

function rejectSub(taskId,userId){
  const t=S.tasks.find(t=>t.id===taskId);
  const sub=t.submissions.find(s=>s.userId===userId);
  sub.status='claimed';sub.work=null;sub.fileName=null;sub.fileDataUrl=null;
  closeModal();toast('Submission rejected. Member can revise and resubmit.','');
}

function delTask(id){
  if(!confirm('Delete this task?'))return;
  S.tasks=S.tasks.filter(t=>t.id!==id);render();toast('Task deleted.','');
}

function createTask(){
  const title=document.getElementById('tTitle')?.value?.trim();
  const desc=document.getElementById('tDesc')?.value?.trim();
  const cat=document.getElementById('tCat')?.value;
  const cap=parseInt(document.getElementById('tCap')?.value||'1');
  const skills=[...document.querySelectorAll('.skill-pick-toggle.on')].map(b=>b.dataset.skill);
  if(!title||!desc){toast('Title and description required','err');return}
  if(!skills.length){toast('Select at least one skill','err');return}
  S.tasks.unshift({id:'t'+Date.now(),title,desc,skills,cat,xp:200,capacity:cap,createdBy:S.uid,createdAt:Date.now(),submissions:[]});
  closeModal();toast('Task created!','ok');
}

async function suggestDistribution(){
  if(!S.apiKey||S.apiKey==='YOUR_GROQ_KEY_HERE'){toast('Add your Groq key to index.html','err');return}
  const title=document.getElementById('tTitle')?.value||'Untitled task';
  const desc=document.getElementById('tDesc')?.value||'';
  const cap=document.getElementById('tCap')?.value||'1';
  const box=document.getElementById('distSugg');
  if(box)box.innerHTML=`<div class="ai-loading-row" style="margin-top:10px"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span style="margin-left:4px">InvoAI thinking...</span></div>`;
  const memberProfiles=members().map(m=>`${m.name}: skills=[${m.skills.join(', ')||'none'}], completed ${approvedByUser(m.id).length} tasks, Lv${lvl(m.xp)}`).join('\n');
  try{
    const res=await callGroq(
      'You help club officers distribute tasks. Given a task and member profiles, suggest who would benefit most (based on skill gaps and growth). Be concise — 2-3 sentences.',
      `Task: ${title}\nDescription: ${desc}\nCapacity: ${cap} member(s)\n\nMembers:\n${memberProfiles}`
    );
    if(box)box.innerHTML=`<div class="ai-suggestion-box"><strong style="color:var(--pri);font-size:11px;text-transform:uppercase;letter-spacing:.4px">💡 InvoAI Suggestion</strong><div style="margin-top:6px">${res}</div></div>`;
  }catch(e){
    if(box)box.innerHTML=`<div style="color:var(--red);font-size:12px;margin-top:8px">Couldn't connect. Check your API key.</div>`;
  }
}

function saveEntry(taskId){
  const text=document.getElementById('entryText')?.value?.trim();
  if(!text){toast('Write your entry first','err');return}
  const u=me();const idx=u.portfolioEntries.findIndex(e=>e.taskId===taskId);
  if(idx>=0)u.portfolioEntries[idx].text=text;
  else u.portfolioEntries.push({taskId,text});
  const nb=awardBadges(u.id);
  closeModal();toast('Portfolio entry saved!','ok');
  if(nb.includes('resume-ready'))setTimeout(()=>openModal('badgeUnlocked','resume-ready'),500);
}

function checkIn(evId){
  const u=me();
  if(!S.attendance.records[evId])S.attendance.records[evId]=[];
  if(S.attendance.records[evId].includes(u.id)){toast('Already checked in!','');return}
  S.attendance.records[evId].push(u.id);
  u.streak=(u.streak||0)+1;
  toast('✅ Checked in!','ok');render();
}

function toggleEvent(evId){
  const ev=S.attendance.events.find(e=>e.id===evId);
  if(ev)ev.isOpen=!ev.isOpen;render();
}

function createEvent(){
  const name=document.getElementById('evName')?.value?.trim();
  const date=document.getElementById('evDate')?.value?.trim()||'Today';
  const location=document.getElementById('evLoc')?.value?.trim()||'';
  if(!name){toast('Event name required','err');return}
  S.attendance.events.unshift({id:'ev'+Date.now(),name,date,location,code:rndCode(),createdBy:S.uid,isOpen:true});
  closeModal();toast('Event created! QR code ready.','ok');
}

function exportResume(){
  const u=me();const done=approvedByUser(u.id);
  let txt=`INVOLVEД RESUME EXPORT\n${'='.repeat(30)}\n${u.name.toUpperCase()}\nLevel ${lvl(u.xp)} · ${u.xp} XP · 🔥${u.streak||0} day streak\n\nSKILLS\n------\n${u.skills.join(' · ')||'None'}\n\nPORTFOLIO\n---------\n`;
  done.forEach(t=>{
    const e=u.portfolioEntries.find(e=>e.taskId===t.id);
    txt+=`• ${t.title}\n${e?'  '+e.text+'\n':''}  Skills: ${t.skills.join(', ')}\n\n`;
  });
  const earned=BADGES.filter(b=>u.badges.includes(b.id));
  txt+=`BADGES\n------\n${earned.map(b=>b.icon+' '+b.name).join(' · ')||'None yet'}\n\nGenerated by InvolvED — Your skills. Your proof.\n`;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));
  a.download=`${u.name.replace(' ','_')}_InvolvED.txt`;a.click();
  toast('Resume exported!','ok');
}

// ── INVOAI FLOATING PANEL ─────────────────────────────
function toggleAI(){
  S.aiOpen=!S.aiOpen;
  const panel=document.getElementById('aiPanel');
  panel.classList.toggle('open',S.aiOpen);
  if(S.aiOpen)updateAIPanel();
}

function updateAIPanel(){
  const chips=['What skills am I building?','Help me write a resume bullet','What tasks should I tackle?','How do I talk about this in interviews?'];
  document.getElementById('aiChips').innerHTML=chips.map(c=>`<button class="ai-chip" onclick="sendAIChip(${JSON.stringify(c)})">${c}</button>`).join('');
}

const aiMsgHistory=[];

async function sendAI(){
  if(!S.apiKey||S.apiKey==='YOUR_GROQ_KEY_HERE'){toast('Add your Groq key to index.html','err');return}
  const input=document.getElementById('aiInput');
  const msg=input?.value?.trim();if(!msg||S.aiLoading)return;
  input.value='';
  appendAIMsg('user',msg);
  aiMsgHistory.push({role:'user',content:msg});
  S.aiLoading=true;
  appendAIMsg('ai','<div style="display:flex;gap:5px"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>',true);
  try{
    const u=me();const done=approvedByUser(u.id);
    const sys=`You are InvoAI, an encouraging AI career coach for community college club students using InvolvED. Be warm, concise, and practical. Student: ${u.name}, Level ${lvl(u.xp)}, Skills: ${u.skills.join(', ')||'none yet'}, Completed tasks: ${done.map(t=>t.title).join(', ')||'none'}. Reference their actual data. Max 3 short paragraphs.`;
    const res=await callGroq(sys,msg,aiMsgHistory.slice(-6));
    aiMsgHistory.push({role:'assistant',content:res});
    replaceLastAIMsg(res);
  }catch(e){
    replaceLastAIMsg(`Connection error: ${e.message}. Check your API key.`);
  }
  S.aiLoading=false;
}

function sendAIChip(text){
  const input=document.getElementById('aiInput');
  if(input){input.value=text;sendAI();}
}

function appendAIMsg(role,content,loading=false){
  const msgs=document.getElementById('aiMsgs');if(!msgs)return;
  const d=document.createElement('div');
  d.className=`ai-msg ${role}`;d.id=loading?'aiLoading':'';
  d.innerHTML=role==='ai'?`<div class="ai-msg-lbl">InvoAI</div>${content}`:content;
  msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;
}

function replaceLastAIMsg(content){
  const loading=document.getElementById('aiLoading');
  if(loading){loading.innerHTML=`<div class="ai-msg-lbl">InvoAI</div>${content}`;loading.removeAttribute('id');}
  const msgs=document.getElementById('aiMsgs');if(msgs)msgs.scrollTop=msgs.scrollHeight;
}

// ── GROQ API HELPER ───────────────────────────────────
async function callGroq(system,user,history=[]){
  const messages=[
    {role:'system',content:system},
    ...history,
    {role:'user',content:user}
  ];
  const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':`Bearer ${GROQ_KEY}`},
    body:JSON.stringify({model:'llama-3.1-8b-instant',messages,max_tokens:512})
  });
  if(!res.ok){const e=await res.json();throw new Error(e.error?.message||'API error')}
  const data=await res.json();
  return data.choices[0].message.content;
}
