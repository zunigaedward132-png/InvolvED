<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InvolvED — Your skills. Your proof.</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
:root{
  /* Earthy Educational — Forest · Terracotta · Parchment · Gold */
  --forest:#1E3A2F;--forest2:#2D5A45;--forest3:#4A7C5F;
  --sage:#7A9E82;--sage2:#A8C5AC;
  --terra:#A0522D;--terra2:#BF6E46;
  --gold:#B8860B;--gold2:#D4A843;--gold3:#EDD07A;
  --sky:#2B5F8A;--sky2:#4A7FAA;
  --red:#8B2E1A;--red2:#A84030;
  --green:#2D6A4F;--green2:#52936E;
  --amber:#8B6914;--amber2:#C49A28;
  --cream:#F5F0E8;--cream2:#EDE6D8;--cream3:#E2D9C8;
  --ink:#1A1208;--stone:#7A6E60;--sand:#C8BFAF;
  --card:#FDFAF4;--cardh:#F7F2E8;
  --bg:var(--cream);--bg2:var(--cream2);
  --text:var(--ink);--muted:var(--stone);--border:var(--sand);
  --pri:var(--forest);--pri2:var(--forest2);--pri3:var(--forest3);
  --pink:var(--terra);--pink2:var(--terra2);
  --cyan:var(--sky);--cyan2:var(--sky2);
  --mint:var(--green);--mint2:var(--green2);
  --orange:var(--terra);--orange2:var(--terra2);
  --r:14px;--rsm:10px;--rxs:6px;
  --sh:0 1px 4px rgba(26,18,8,.06),0 4px 16px rgba(26,18,8,.08);
  --shmd:0 4px 12px rgba(26,18,8,.08),0 16px 40px rgba(26,18,8,.12);
  --shlg:0 8px 24px rgba(26,18,8,.10),0 32px 64px rgba(26,18,8,.16);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
#app{min-height:100vh;display:flex;flex-direction:column}

/* ── TOPBAR ── */
.topbar{background:var(--card);color:var(--ink);padding:0 28px;height:58px;display:flex;align-items:center;gap:20px;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--sand)}
.logo{font-size:19px;font-weight:900;letter-spacing:-.5px;flex-shrink:0;color:var(--ink)}
.logo-t{color:var(--forest2)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.topnav{display:flex;gap:2px;align-items:center}
.tnav-item{padding:7px 15px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:none;color:var(--stone);font-family:inherit;transition:all .18s;position:relative;white-space:nowrap}
.tnav-item:hover{background:var(--cream2);color:var(--ink)}
.tnav-item.active{background:var(--forest);color:#fff}
.tnav-dot{width:6px;height:6px;border-radius:50%;background:#E8936A;position:absolute;top:6px;right:4px;animation:pulse 1.8s infinite}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0}
.user-chip{display:flex;align-items:center;gap:8px;background:var(--cream);border-radius:999px;padding:4px 14px 4px 4px;border:1px solid var(--sand)}
.u-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;color:#fff;flex-shrink:0}
.u-name{font-size:13px;font-weight:600;color:var(--ink)}
.role-pill{font-size:9px;padding:2px 7px;border-radius:999px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.role-pill.member{background:#E8F0EB;color:var(--forest2)}
.role-pill.officer{background:#FAF0E0;color:var(--gold)}
.role-pill.advisor{background:#EEE8DC;color:var(--terra)}
.icon-btn{background:none;border:none;cursor:pointer;color:var(--stone);font-size:18px;padding:4px;line-height:1;transition:color .2s}
.icon-btn:hover{color:var(--ink)}

/* ── LAYOUT ── */
.app-body{flex:1;overflow:hidden}
.main{overflow-y:auto;padding:32px 40px;min-width:0;animation:pageIn .35s cubic-bezier(.25,.46,.45,.94) both;min-height:calc(100vh - 58px)}
.main-inner{max-width:880px;margin:0 auto}
@keyframes pageIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* ── STAT CARDS ── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:28px}
.stat-card{background:var(--card);border-radius:var(--r);padding:22px;border:1px solid var(--sand);box-shadow:var(--sh);cursor:default;transition:transform .25s cubic-bezier(.25,.46,.45,.94),box-shadow .25s}
.stat-card:hover{transform:translateY(-3px);box-shadow:var(--shmd)}
.stat-val{font-size:36px;font-weight:900;line-height:1;letter-spacing:-1px}
.check-spring{display:inline-block;animation:checkSpring .5s cubic-bezier(.34,1.56,.64,1) both}
@keyframes checkSpring{0%{transform:scale(.3);opacity:0}55%{transform:scale(1.25)}80%{transform:scale(.92)}100%{transform:scale(1);opacity:1}}
.approve-flash{animation:approveFlash .7s ease}
@keyframes approveFlash{0%{background:var(--card)}30%{background:#E3F4E8}100%{background:var(--card)}}
.stat-lbl{font-size:12px;color:var(--stone);margin-top:6px;font-weight:500;letter-spacing:.2px}
.stat-ico{font-size:24px;margin-bottom:8px}

/* ── TASK CARDS ── */
.task-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-bottom:24px}
.tcard{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column;transition:transform .28s cubic-bezier(.25,.46,.45,.94),box-shadow .28s;min-height:240px;border:1px solid var(--sand);animation:tcardIn .4s cubic-bezier(.25,.46,.45,.94) both}
.tcard:hover{transform:translateY(-5px) scale(1.01);box-shadow:var(--shmd)}
.tcard.tcard-leaving{animation:tcardOut .4s cubic-bezier(.25,.46,.45,.94) forwards;pointer-events:none}
@keyframes tcardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes tcardOut{0%{opacity:1;transform:scale(1)}60%{opacity:.4;transform:scale(.92) translateX(18px)}100%{opacity:0;transform:scale(.85) translateX(40px)}}
.tcard-top{height:5px}
.tcard-body{padding:18px;display:flex;flex-direction:column;flex:1}
.tcard-cat-row{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.tcard-cat-icon{font-size:18px}
.tcard-cat-lbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.7px}
.tcard-title{font-size:14px;font-weight:800;line-height:1.4;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;letter-spacing:-.1px}
.tcard-desc{font-size:12px;color:var(--stone);flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:12px;line-height:1.55}
.tcard-skills{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
.tcard-footer{display:flex;align-items:center;justify-content:space-between;margin-top:auto;gap:6px}
.tcard-cap{font-size:11px;color:var(--stone);font-weight:600}

/* ── STATUS & SKILL CHIPS ── */
.s-chip{font-size:10px;padding:2px 9px;border-radius:999px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;flex-shrink:0}
.s-open{background:#E8F0EB;color:var(--forest2)}
.s-claimed{background:#FEF6E4;color:var(--gold)}
.s-review{background:#E8EEF5;color:var(--sky)}
.s-approved{background:#E8F0EB;color:var(--green);animation:checkSpring .5s cubic-bezier(.34,1.56,.64,1) both}
.s-full{background:var(--cream2);color:var(--stone)}
.sk-tag{font-size:10px;padding:2px 8px;border-radius:999px;background:var(--cream2);color:var(--forest2);font-weight:600;border:1px solid var(--sand)}


/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:var(--rsm);font-size:13.5px;font-weight:700;cursor:pointer;border:none;transition:all .22s cubic-bezier(.25,.46,.45,.94);line-height:1;font-family:inherit;letter-spacing:.1px}
.btn:hover:not(:disabled){box-shadow:0 4px 12px rgba(0,0,0,.08)}
.btn:active{transform:scale(.97)!important}
.btn-pri{background:var(--forest);color:#fff;box-shadow:0 2px 8px rgba(30,58,47,.3)}
.btn-pri:hover{background:var(--forest2);transform:translateY(-1px);box-shadow:0 4px 16px rgba(30,58,47,.35)}
.btn-teal{background:var(--green);color:#fff;box-shadow:0 2px 8px rgba(45,106,79,.3)}
.btn-teal:hover{background:var(--green2);transform:translateY(-1px)}
.btn-orange{background:var(--terra);color:#fff;box-shadow:0 2px 8px rgba(160,82,45,.3)}
.btn-orange:hover{background:var(--terra2);transform:translateY(-1px)}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--sand)}
.btn-ghost:hover{background:var(--cream2);border-color:var(--stone)}
.btn-danger{background:#F5EAE8;color:var(--red)}
.btn-danger:hover{background:#F0D8D4}
.btn-ai{background:var(--forest);color:#fff;box-shadow:0 2px 8px rgba(30,58,47,.3)}
.btn-ai:hover{background:var(--forest2);transform:translateY(-1px)}
.btn-sm{padding:6px 13px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;box-shadow:none!important}

/* ── FILTER TABS ── */
.filter-row{display:flex;gap:3px;margin-bottom:22px;background:var(--card);padding:4px;border-radius:var(--rsm);border:1px solid var(--sand);width:fit-content;box-shadow:var(--sh)}
.ftab{padding:7px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:none;color:var(--stone);font-family:inherit;transition:all .18s;letter-spacing:.1px}
.ftab.active{background:var(--forest);color:#fff;box-shadow:0 2px 6px rgba(30,58,47,.25)}
.ftab:hover:not(.active){background:var(--cream);color:var(--ink)}

/* ── BADGES ── */
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.badge-card{border-radius:var(--r);padding:20px 14px;text-align:center;border:1.5px solid var(--sand);transition:all .25s;background:var(--card)}
.badge-card.earned{border-color:transparent;animation:badgePop .45s cubic-bezier(.34,1.56,.64,1);box-shadow:var(--shmd)}
.badge-icon-big{font-size:34px;margin-bottom:8px}
.badge-name{font-size:12px;font-weight:800;margin-bottom:3px;letter-spacing:-.1px}
.badge-desc{font-size:11px;color:var(--stone)}
.badge-card:not(.earned) .badge-icon-big{filter:grayscale(1);opacity:.25}
.badge-card:not(.earned) .badge-name{color:var(--stone)}
.earned-tick{font-size:10px;font-weight:800;margin-top:5px;color:var(--forest2)}
@keyframes badgePop{0%{transform:scale(.55);opacity:0}65%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}

/* ── LEADERBOARD ── */
.lb-list{display:flex;flex-direction:column;gap:10px}
.lb-row{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:var(--r);padding:16px 20px;border:1px solid var(--sand);box-shadow:var(--sh);transition:transform .22s,box-shadow .22s}
.lb-row:hover{transform:translateX(2px);box-shadow:var(--shmd)}
.lb-row.you{border-color:var(--forest3);background:linear-gradient(90deg,#EEF3EB,#F5F8F2)}
.rank{font-size:18px;font-weight:900;width:32px;text-align:center;color:var(--stone)}
.rank-1{color:#B8860B}.rank-2{color:#8A9299}.rank-3{color:#8B6914}
.lb-av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff}
.lb-name{font-weight:700;font-size:15px;letter-spacing:-.1px}
.lb-sub{font-size:12px;color:var(--stone)}

/* ── RESUME ── */
.skill-bank{display:flex;flex-wrap:wrap;gap:8px}
.skill-bank-tag{background:var(--cream2);color:var(--forest);border:1.5px solid var(--sand);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;transition:all .2s}
.skill-bank-tag:hover{background:var(--forest);color:#fff;border-color:var(--forest)}
.pe-card{background:var(--card);border-radius:var(--r);padding:20px 22px;border:1px solid var(--sand);margin-bottom:12px;transition:box-shadow .2s}
.pe-card:hover{box-shadow:var(--shmd)}
.pe-title{font-weight:800;margin-bottom:5px;letter-spacing:-.1px}
.pe-text{font-size:13px;color:var(--stone);margin-bottom:8px;line-height:1.6}
.pe-empty{font-size:13px;color:var(--sage);font-style:italic;margin-bottom:8px}
.file-attached{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sky);font-weight:600;background:#EEF3F8;padding:4px 10px;border-radius:999px;cursor:pointer}

/* ── MEMBERS ── */
.member-list{display:flex;flex-direction:column;gap:10px}
.m-row{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:var(--r);padding:18px 20px;border:1px solid var(--sand);box-shadow:var(--sh);transition:transform .22s,box-shadow .22s}
.m-row:hover{transform:translateX(3px);box-shadow:var(--shmd)}
.m-av{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:#fff;flex-shrink:0}
.m-name{font-weight:700;font-size:15px;letter-spacing:-.1px}
.m-sub{font-size:12px;color:var(--stone)}
.m-stats{margin-left:auto;display:flex;gap:22px}
.mstat{text-align:center}
.mstat-v{font-weight:900;font-size:18px;color:var(--forest)}
.mstat-l{font-size:10px;color:var(--stone);text-transform:uppercase;letter-spacing:.3px}

/* ── ATTENDANCE ── */
.att-hero{position:relative;background:var(--forest);border-radius:var(--r);padding:32px 36px;color:#fff;margin-bottom:28px;overflow:hidden;display:flex;align-items:center;gap:24px;min-height:150px}
.att-hero-text{flex:1;z-index:2;position:relative}
.att-hero-title{font-size:28px;font-weight:900;letter-spacing:-.7px;margin-bottom:6px}
.att-hero-sub{font-size:13px;opacity:.75;margin-bottom:18px;line-height:1.55}
.att-mascot-wrap{position:absolute;right:0;bottom:0;height:165px;display:flex;align-items:flex-end;z-index:1;pointer-events:none}
.att-mascot{height:160px;width:auto;animation:mascotFloat 5s ease-in-out infinite;filter:drop-shadow(0 8px 28px rgba(0,0,0,.25));opacity:.85}
.att-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 80% 50%,rgba(74,124,95,.35),transparent 65%);pointer-events:none}
@keyframes mascotFloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-10px) rotate(1deg)}}
.att-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:16px;margin-bottom:22px}
.att-card{background:var(--card);border-radius:var(--r);padding:24px;border:1px solid var(--sand);box-shadow:var(--sh);position:relative;overflow:hidden;transition:transform .25s cubic-bezier(.25,.46,.45,.94),box-shadow .25s}
.att-card:hover{transform:translateY(-4px);box-shadow:var(--shmd)}
.att-card-open{border-color:var(--forest3);background:linear-gradient(135deg,#EEF4EC,#F5F8F3)}
.att-event-name{font-size:16px;font-weight:800;margin-bottom:4px;letter-spacing:-.2px}
.att-event-meta{font-size:12px;color:var(--stone);margin-bottom:14px}
.att-code{display:inline-block;font-family:'SF Mono',Monaco,monospace;font-size:20px;font-weight:900;color:var(--forest);background:var(--cream2);padding:8px 16px;border-radius:var(--rxs);letter-spacing:4px;margin-bottom:14px;border:1.5px solid var(--sand)}
.qr-wrap{background:#fff;border:2px solid var(--sand);border-radius:var(--rsm);padding:8px;display:inline-block;position:relative}
.qr-img{border-radius:6px;display:block}
.qr-mascot{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:30px;height:30px;object-fit:contain;border-radius:6px;background:#fff;padding:2px}
.att-count{font-size:13px;color:var(--stone);font-weight:600;margin-top:12px}
.checkin-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.checkin-chip{font-size:11px;padding:3px 9px;background:#E8F0EB;color:var(--forest2);border-radius:999px;font-weight:600}
.att-mascot-mini{width:40px;height:40px;object-fit:contain;position:absolute;bottom:12px;right:14px;animation:mascotFloat 5s ease-in-out infinite;opacity:.5;filter:drop-shadow(0 2px 6px rgba(30,58,47,.2))}

/* ── CHECKIN ── */
.event-list{display:flex;flex-direction:column;gap:10px}
.event-row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:var(--r);padding:16px 20px;border:1px solid var(--sand);box-shadow:var(--sh);transition:box-shadow .2s}
.event-open-row{border-color:var(--forest3);background:linear-gradient(90deg,#EEF4EC,#F5F8F3)}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(26,18,8,.45);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;backdrop-filter:blur(8px)}
.modal{background:var(--card);border-radius:var(--r);width:100%;max-width:540px;max-height:90vh;overflow-y:auto;box-shadow:var(--shlg);animation:slideUp .3s cubic-bezier(.34,1.26,.64,1);border:1px solid var(--sand)}
@keyframes slideUp{from{transform:translateY(40px) scale(.97);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
.modal-hdr{padding:24px 26px 0;display:flex;align-items:center;justify-content:space-between}
.modal-ttl{font-size:18px;font-weight:800;letter-spacing:-.3px}
.modal-body{padding:18px 26px}
.modal-ftr{padding:0 26px 22px;display:flex;gap:8px;justify-content:flex-end}
.close-btn{background:var(--cream2);border:none;font-size:16px;cursor:pointer;color:var(--stone);line-height:1;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .15s}
.close-btn:hover{background:var(--cream3);color:var(--ink)}

/* ── FORMS ── */
.fg{margin-bottom:16px}
.fl{display:block;font-size:11px;font-weight:800;margin-bottom:6px;color:var(--stone);text-transform:uppercase;letter-spacing:.6px}
.fi,.fta,.fsel{width:100%;padding:11px 14px;border:1.5px solid var(--sand);border-radius:var(--rsm);font-size:14px;font-family:inherit;outline:none;transition:border-color .2s,box-shadow .2s;background:var(--card);color:var(--ink)}
.fi:focus,.fta:focus,.fsel:focus{border-color:var(--forest2);box-shadow:0 0 0 3px rgba(45,90,69,.12)}
.fta{min-height:90px;resize:vertical}
.skill-picks{display:flex;flex-wrap:wrap;gap:6px;padding:10px;border:1.5px solid var(--sand);border-radius:var(--rsm);background:var(--cream)}
.skill-pick-toggle{padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;border:1.5px solid var(--sand);background:var(--card);color:var(--stone);font-family:inherit;transition:all .18s}
.skill-pick-toggle.on{background:var(--forest);color:#fff;border-color:var(--forest)}
.skill-pick-toggle:hover:not(.on){border-color:var(--forest2);color:var(--forest2)}
.ai-skill-chip{padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;border:1.5px solid var(--forest3);background:#E8F0EB;color:var(--forest);font-family:inherit;transition:all .18s}
.ai-skill-chip.off{background:var(--cream2);color:var(--stone);border-color:var(--sand)}
.file-input-wrap{border:2px dashed var(--sand);border-radius:var(--rsm);padding:18px;text-align:center;cursor:pointer;transition:all .2s;background:var(--cream)}
.file-input-wrap:hover{border-color:var(--forest2);background:var(--cream2)}
.file-input-wrap input{display:none}
.ai-suggestion-box{background:linear-gradient(135deg,#EEF4EC,#F2F7EF);border:1.5px solid var(--sage2);border-radius:var(--rsm);padding:14px;margin-top:12px;font-size:13px;line-height:1.65}
.ai-loading-row{display:flex;align-items:center;gap:8px;color:var(--stone);font-size:13px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--forest3);animation:bounce 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:scale(.7);opacity:.4}40%{transform:scale(1.2);opacity:1}}

/* ── LOGIN ── */
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(150deg,#0D2218 0%,#1E3A2F 40%,#2D5A45 75%,#4A7C5F 100%);padding:20px;position:relative;overflow:hidden}
.login-page::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 20% 80%,rgba(184,134,11,.15),transparent 55%),radial-gradient(ellipse at 80% 20%,rgba(160,82,45,.12),transparent 50%)}
.login-bg-mascot{position:absolute;bottom:0;right:3%;height:58vh;max-height:440px;object-fit:contain;opacity:.10;pointer-events:none;animation:mascotFloat 7s ease-in-out infinite}
.login-card{background:var(--card);border-radius:20px;padding:40px;width:100%;max-width:480px;box-shadow:var(--shlg);position:relative;z-index:1;border:1px solid var(--sand)}
.login-logo{font-size:34px;font-weight:900;letter-spacing:-.8px;margin-bottom:4px;color:var(--ink)}
.login-tagline{color:var(--stone);font-size:14px;margin-bottom:26px}
.login-section-lbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--stone);margin-bottom:10px}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.pick-btn{display:flex;align-items:center;gap:10px;padding:13px;border:1.5px solid var(--sand);border-radius:var(--rsm);cursor:pointer;transition:all .2s;background:var(--card);font-family:inherit;text-align:left}
.pick-btn:hover{border-color:var(--forest2);background:var(--cream);transform:translateY(-1px);box-shadow:var(--sh)}
.pick-av{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;flex-shrink:0}
.pick-name{font-weight:700;font-size:13px}
.pick-role{font-size:11px;color:var(--stone);text-transform:capitalize}
.divider{height:1px;background:var(--sand);margin:18px 0}
.or-text{text-align:center;font-size:12px;color:var(--stone);margin:14px 0;position:relative}
.or-text::before,.or-text::after{content:'';position:absolute;top:50%;width:44%;height:1px;background:var(--sand)}
.or-text::before{left:0}.or-text::after{right:0}

/* ── FLOATING AI FAB ── */
.ai-fab{position:fixed;bottom:26px;right:26px;width:58px;height:58px;border-radius:50%;background:var(--forest);box-shadow:0 6px 24px rgba(30,58,47,.45);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:26px;z-index:900;transition:all .25s cubic-bezier(.34,1.56,.64,1);border:none}
.ai-fab:hover{transform:scale(1.1) rotate(-5deg);box-shadow:0 10px 36px rgba(30,58,47,.55)}

/* ── AI SIDE PANEL ── */
.ai-panel{position:fixed;top:0;right:0;bottom:0;width:min(380px,100vw);background:var(--cream);z-index:950;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s cubic-bezier(.25,.46,.45,.94);box-shadow:-6px 0 32px rgba(0,0,0,.15)}
.ai-panel.open{transform:translateX(0)}
.ai-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:940;opacity:0;pointer-events:none;transition:opacity .3s}
.ai-backdrop.open{opacity:1;pointer-events:auto}
.ai-fs-hdr{background:var(--forest);padding:14px 18px;color:#fff;display:flex;align-items:center;gap:12px;flex-shrink:0}
.ai-fs-logo{width:38px;height:38px;object-fit:contain;background:rgba(255,255,255,.12);border-radius:10px;padding:4px;flex-shrink:0}
.ai-fs-title{font-size:16px;font-weight:900;letter-spacing:-.3px}
.ai-fs-tagline{font-size:10px;opacity:.65;margin-top:1px}
.ai-close{background:rgba(255,255,255,.12);border:none;color:#fff;font-size:18px;cursor:pointer;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-left:auto;transition:background .15s;flex-shrink:0}
.ai-close:hover{background:rgba(255,255,255,.25)}
.ai-msgs{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.ai-msg{max-width:85%;padding:10px 14px;border-radius:16px;font-size:13px;line-height:1.6}
.ai-msg.user{align-self:flex-end;background:var(--forest);color:#fff;border-bottom-right-radius:4px}
.ai-msg.ai{align-self:flex-start;background:var(--card);color:var(--ink);border:1px solid var(--sand);border-bottom-left-radius:4px;box-shadow:var(--sh);max-width:90%}
.ai-msg-lbl{font-size:9px;font-weight:800;color:var(--terra);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.ai-chips-row{display:flex;flex-wrap:wrap;gap:6px;padding:10px 18px;background:var(--card);border-top:1px solid var(--sand);flex-shrink:0}
.ai-chip{background:var(--cream);border:1.5px solid var(--sand);border-radius:999px;padding:6px 13px;font-size:12px;cursor:pointer;font-family:inherit;transition:all .18s;font-weight:600;color:var(--ink)}
.ai-chip:hover{border-color:var(--forest2);color:var(--forest);background:var(--cream2);transform:translateY(-1px)}
.ai-input-row{display:flex;gap:8px;padding:12px 18px;background:var(--card);border-top:1px solid var(--sand);flex-shrink:0}
.ai-input{flex:1;padding:11px 16px;border:1.5px solid var(--sand);border-radius:999px;font-size:14px;font-family:inherit;outline:none;background:var(--cream);color:var(--ink)}
.ai-input:focus{border-color:var(--forest2);background:var(--card);box-shadow:0 0 0 3px rgba(45,90,69,.1)}
.task-bubbles{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.task-bubble{background:var(--card);border:1.5px solid var(--sand);border-radius:var(--rsm);padding:10px 13px;cursor:pointer;transition:all .22s cubic-bezier(.25,.46,.45,.94);min-width:140px;max-width:200px}
.task-bubble:hover{border-color:var(--forest2);background:var(--cream);transform:translateY(-3px);box-shadow:var(--shmd)}
.tb-icon{font-size:20px;margin-bottom:4px}
.tb-title{font-size:12px;font-weight:700;line-height:1.3;margin-bottom:4px}
.summary-card{background:linear-gradient(135deg,#EEF4EC,#F5F8F2);border:1.5px solid var(--sage2);border-radius:var(--rsm);padding:16px;margin-top:10px}
.summary-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.summary-stat{text-align:center;flex:1;min-width:50px}
.summary-stat-v{font-size:22px;font-weight:900;color:var(--forest)}
.summary-stat-l{font-size:10px;color:var(--stone);text-transform:uppercase;letter-spacing:.3px}
.summary-skills{display:flex;flex-wrap:wrap;gap:5px}

/* ── PAGE HEADERS ── */
.page-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px;gap:14px}
.page-title{font-size:28px;font-weight:900;color:var(--ink);letter-spacing:-.7px;line-height:1.1}
.page-sub{font-size:13px;color:var(--stone);margin-top:5px;font-weight:400}
.sec-title{font-size:15px;font-weight:800;color:var(--ink);margin-bottom:14px;letter-spacing:-.1px}
.sec-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}

/* ── TOAST ── */
.toast-wrap{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:3000;display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--cream);padding:11px 24px;border-radius:999px;font-size:13.5px;font-weight:600;box-shadow:var(--shmd);animation:toastIn .3s cubic-bezier(.34,1.36,.64,1);pointer-events:all;letter-spacing:.1px}
.toast.ok{background:var(--forest);color:#fff}
.toast.err{background:var(--red);color:#fff}
@keyframes toastIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}


/* ── EMPTY ── */
.empty{text-align:center;padding:52px 20px;color:var(--stone)}
.empty-ico{font-size:44px;margin-bottom:12px;opacity:.5}
.empty-ttl{font-size:17px;font-weight:800;color:var(--ink);margin-bottom:6px;letter-spacing:-.2px}

/* ── DASHBOARD ── */
.welcome-banner{background:var(--forest);border-radius:var(--r);padding:24px 28px;color:#fff;margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;gap:18px;box-shadow:var(--shmd)}
.welcome-title{font-size:22px;font-weight:900;letter-spacing:-.4px;margin-bottom:4px}
.welcome-sub{font-size:13px;opacity:.75}

/* ── INTERNSHIPS ── */
.intern-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px;margin-bottom:24px}
.intern-card{background:var(--card);border-radius:var(--r);border:1px solid var(--sand);box-shadow:var(--sh);overflow:hidden;transition:transform .25s cubic-bezier(.25,.46,.45,.94),box-shadow .25s}
.intern-card:hover{transform:translateY(-4px);box-shadow:var(--shmd)}
.intern-card.matched{border-color:var(--forest3)}
.intern-card.partial{border-color:var(--gold2)}
.intern-top{padding:16px 16px 12px;display:flex;align-items:flex-start;gap:10px}
.intern-icon{font-size:30px;flex-shrink:0}
.intern-title{font-size:14px;font-weight:800;line-height:1.3;margin-bottom:2px;letter-spacing:-.1px}
.intern-company{font-size:11px;color:var(--stone)}
.intern-body{padding:0 16px 16px}
.intern-desc{font-size:12px;color:var(--stone);line-height:1.55;margin-bottom:12px}
.intern-progress{margin-bottom:10px}
.intern-pct{font-size:11px;font-weight:700;color:var(--ink);margin-bottom:5px;display:flex;justify-content:space-between}
.intern-bar{height:7px;background:var(--cream2);border-radius:4px;overflow:hidden}
.intern-bar-fill{height:100%;border-radius:4px;transition:width .9s cubic-bezier(.25,.46,.45,.94)}
.intern-skills{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
.intern-skill{font-size:10px;padding:2px 7px;border-radius:999px;font-weight:600}
.intern-skill.have{background:#E8F0EB;color:var(--forest2)}
.intern-skill.need{background:#F5EAE8;color:var(--red)}
.match-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
.match-badge.full{background:#E8F0EB;color:var(--forest)}
.match-badge.partial{background:#FEF6E4;color:var(--gold)}
.match-badge.low{background:var(--cream2);color:var(--stone)}
.li-skill-tag{font-size:10px;padding:3px 8px;border-radius:4px;font-weight:600;background:#EEF3F8;color:var(--sky);border:1px solid #CBD8E8}

/* ── CLUB EVENTS ── */
.event-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(295px,1fr));gap:16px;margin-bottom:26px}
.event-card{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);border:1px solid var(--sand);cursor:pointer;transition:transform .28s cubic-bezier(.25,.46,.45,.94),box-shadow .28s}
.event-card:hover{transform:translateY(-5px) scale(1.01);box-shadow:var(--shmd)}
.event-card-band{height:6px}
.event-card-body{padding:20px 22px 18px}
.event-card-icon{font-size:32px;margin-bottom:10px}
.event-card-title{font-size:16px;font-weight:900;letter-spacing:-.3px;margin-bottom:6px}
.event-card-desc{font-size:12px;color:var(--stone);line-height:1.55;margin-bottom:16px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.event-card-footer{display:flex;align-items:center;justify-content:space-between;gap:8px}
.event-date-chip{font-size:11px;font-weight:700;color:var(--stone)}
.event-task-count{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--cream2);color:var(--ink)}
.event-signup-count{font-size:11px;font-weight:700;color:var(--forest2)}
.event-detail-hero{background:var(--forest);border-radius:var(--r);padding:28px 32px;color:#fff;margin-bottom:26px;position:relative;overflow:hidden}
.event-detail-hero::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 85% 40%,rgba(74,124,95,.5),transparent 60%)}
.event-detail-icon{font-size:44px;margin-bottom:10px;position:relative;z-index:1}
.event-detail-title{font-size:26px;font-weight:900;letter-spacing:-.6px;margin-bottom:5px;position:relative;z-index:1}
.event-detail-meta{font-size:13px;opacity:.75;position:relative;z-index:1}
.event-task-list{display:flex;flex-direction:column;gap:12px;margin-bottom:80px}
.event-task-item{background:var(--card);border-radius:var(--r);border:1px solid var(--sand);box-shadow:var(--sh);overflow:hidden;transition:transform .22s,box-shadow .22s}
.event-task-item:hover{transform:translateX(3px);box-shadow:var(--shmd)}
.event-task-item.full{opacity:.7}
.event-task-hdr{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 12px}
.event-task-info{flex:1;min-width:0}
.event-task-title{font-size:14px;font-weight:800;margin-bottom:3px;letter-spacing:-.1px}
.event-task-desc{font-size:12px;color:var(--stone);line-height:1.55}
.event-task-foot{padding:0 20px 16px;display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.slots-bar{display:flex;gap:4px;align-items:center}
.slot-pip{width:10px;height:10px;border-radius:50%;background:var(--sand)}
.slot-pip.filled{background:var(--forest3)}
.slot-pip.mine{background:var(--forest)}
.signee-chip{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--cream2);color:var(--stone);font-weight:600}
.signee-chip.me{background:#E8F0EB;color:var(--forest);font-weight:700}

/* ── CAREER LABELS ── */
.career-label-grid{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.career-label-btn{display:flex;align-items:center;gap:7px;padding:9px 15px;border-radius:var(--rsm);font-size:13px;font-weight:700;cursor:pointer;border:2px solid var(--sand);background:var(--card);color:var(--ink);font-family:inherit;transition:all .18s}
.career-label-btn:hover{border-color:var(--forest2);background:var(--cream2)}
.career-label-btn.active{border-color:var(--forest);background:#E8F0EB;color:var(--forest)}

/* ── STATUS BADGES ── */
.status-badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:999px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.status-badge.ongoing{background:#D1FAE5;color:var(--green)}
.status-badge.upcoming{background:#DBEAFE;color:#1D4ED8}
.status-badge.past{background:var(--cream2);color:var(--stone)}

/* ── REQUEST CARD ── */
.request-card{background:var(--card);border-radius:var(--r);padding:16px 18px;border:1px solid var(--sand);box-shadow:var(--sh)}

/* ── SUBMIT STEP TOGGLE ── */
.submit-tab-toggle{display:flex;gap:0;border:1.5px solid var(--sand);border-radius:var(--rsm);overflow:hidden;margin-bottom:16px}
.submit-tab-btn{flex:1;padding:8px 14px;background:var(--cream);border:none;cursor:pointer;font-size:13px;font-weight:600;color:var(--stone);transition:all .2s}
.submit-tab-btn.active{background:var(--forest);color:#fff}
.review-feedback-box{background:#FFF8E7;border:1px solid #FDE68A;border-radius:var(--rsm);padding:8px 12px;font-size:12px;color:#92400E;margin-top:8px}
.request-actions{display:flex;gap:6px;flex-wrap:wrap}

/* ── OPPORTUNITY CARD ── */
.opportunity-card{background:var(--card);border-radius:var(--r);padding:16px 18px;border:1px solid var(--sand);box-shadow:var(--sh);transition:transform .22s,box-shadow .22s}
.opportunity-card:hover{transform:translateY(-3px);box-shadow:var(--shmd)}

/* ── FEED ── */
.feed-wrap{display:flex;flex-direction:column;gap:12px;margin-bottom:80px}
.feed-msg{background:var(--card);border-radius:var(--r);padding:16px 18px;border:1px solid var(--sand);box-shadow:var(--sh);transition:box-shadow .2s}
.feed-msg:hover{box-shadow:var(--shmd)}
.feed-msg.announcement{border-left:4px solid var(--forest);background:linear-gradient(135deg,#EEF4EC,#F5F8F3)}
.feed-msg.announcement.advisor-post{border-left-color:var(--gold)}
.feed-hdr{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.feed-av{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;flex-shrink:0}
.feed-name{font-weight:700;font-size:14px;letter-spacing:-.1px}
.feed-meta{font-size:11px;color:var(--stone)}
.ann-badge{font-size:9px;padding:2px 8px;border-radius:999px;background:var(--forest);color:#fff;font-weight:700;margin-left:5px;letter-spacing:.3px}
.feed-text{font-size:14px;line-height:1.65;color:var(--ink);margin-bottom:12px;white-space:pre-wrap}
.feed-reactions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.reaction-btn{background:var(--cream);border:1.5px solid var(--sand);border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer;font-family:inherit;transition:all .18s;display:flex;align-items:center;gap:4px}
.reaction-btn.reacted{background:#E8F0EB;border-color:var(--forest3)}
.reaction-btn:hover{border-color:var(--forest2);transform:scale(1.06)}
.reaction-count{font-size:12px;font-weight:700;color:var(--stone)}
.add-reaction{background:none;border:1.5px dashed var(--sand);border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer;color:var(--stone);transition:all .18s}
.add-reaction:hover{border-color:var(--forest2);color:var(--forest2)}
.feed-composer{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--sand);padding:14px 40px;display:flex;gap:10px;align-items:flex-end;z-index:50;box-shadow:0 -4px 20px rgba(26,18,8,.06)}
.feed-textarea{flex:1;padding:10px 14px;border:1.5px solid var(--sand);border-radius:var(--rsm);font-size:14px;font-family:inherit;outline:none;resize:none;min-height:42px;max-height:100px;transition:all .2s;background:var(--cream);color:var(--ink)}
.feed-textarea:focus{border-color:var(--forest2);background:var(--card);box-shadow:0 0 0 3px rgba(45,90,69,.1)}
.ann-toggle{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--stone);cursor:pointer;flex-shrink:0}
.ann-toggle input{width:auto}
@media(max-width:768px){.main{padding:16px 14px}.task-grid{grid-template-columns:1fr 1fr}.picks{grid-template-columns:1fr}.feed-composer{padding:10px 14px}.topnav{display:none}}
</style>

<body>
<div id="app"></div>
<div class="toast-wrap" id="toasts"></div>
<button class="ai-fab" id="aiFab" onclick="toggleAI()">🤖</button>
<div class="ai-backdrop" id="aiBackdrop" onclick="toggleAI()"></div>
<div class="ai-panel" id="aiPanel">
  <div class="ai-fs-hdr">
    <img src="https://i.imgur.com/KaSEx7u.png" class="ai-fs-logo" onerror="this.style.display='none'">
    <div>
      <div class="ai-fs-title">InvoAI</div>
      <div class="ai-fs-tagline">Your skills. Your proof.</div>
    </div>
    <button class="ai-close" onclick="toggleAI()">✕</button>
  </div>
  <div id="aiMsgs" class="ai-msgs">
    <div class="ai-msg ai"><div class="ai-msg-lbl">InvoAI</div>Hi! I'm your career coach. What can I help you with? 🚀</div>
  </div>
  <div class="ai-chips-row" id="aiChips"></div>
  <div class="ai-input-row">
    <input class="ai-input" id="aiInput" placeholder="Ask InvoAI anything..." onkeydown="if(event.key==='Enter')sendAI()">
    <button class="btn btn-ai" onclick="sendAI()">Send</button>
  </div>
</div>

<script>
// ── CONFIG ─────────────────────────────────────────────
const API_URL = '/api';

// ── CONSTANTS ──────────────────────────────────────────
const CAT={
  research:     {c:'#2563EB',bg:'#EFF6FF',icon:'🔬',lbl:'Research'},
  creative:     {c:'#DB2777',bg:'#FDF2F8',icon:'🎨',lbl:'Creative'},
  leadership:   {c:'#EA580C',bg:'#FFF7ED',icon:'🚀',lbl:'Leadership'},
  administrative:{c:'#7C3AED',bg:'#F5F3FF',icon:'📋',lbl:'Admin'},
  tech:         {c:'#0891B2',bg:'#ECFEFF',icon:'💻',lbl:'Tech'},
  general:      {c:'#4B5563',bg:'#F9FAFB',icon:'📌',lbl:'General'},
};

const BADGES=[
  {id:'first-step',  icon:'🌱',name:'First Step',  desc:'Complete your first task',  grad:'linear-gradient(135deg,#D1FAE5,#A7F3D0)'},
  {id:'go-getter',   icon:'🚀',name:'Go-Getter',   desc:'Complete 3 tasks',           grad:'linear-gradient(135deg,#FEF3C7,#FDE68A)'},
  {id:'team-player', icon:'🤝',name:'Team Player', desc:'Claim a task',               grad:'linear-gradient(135deg,#DBEAFE,#BFDBFE)'},
  {id:'all-rounder', icon:'⭐',name:'All-Rounder', desc:'Earn skills in 3+ categories',grad:'linear-gradient(135deg,#EDE9FE,#DDD6FE)'},
  {id:'researcher',  icon:'🔬',name:'Researcher',  desc:'Complete a research task',   grad:'linear-gradient(135deg,#E0F2FE,#BAE6FD)'},
  {id:'creative',    icon:'🎨',name:'Creative',    desc:'Complete a creative task',   grad:'linear-gradient(135deg,#FCE7F3,#FBCFE8)'},
  {id:'leader',      icon:'👑',name:'Leader',      desc:'Approve 5 tasks (officers)', grad:'linear-gradient(135deg,#FEF9C3,#FEF08A)'},
  {id:'resume-ready',icon:'📄',name:'Resume Ready',desc:'Add your first portfolio entry',grad:'linear-gradient(135deg,#F3E8FF,#E9D5FF)'},
];

const SKILL_CATS={

const SKILL_TO_LABEL={
  'Leadership':'organizer','Organization':'organizer','Management':'planner','Event Planning':'planner',
  'Research':'researcher','Analysis':'analyst','Data':'analyst','Data Analysis':'analyst',
  'Marketing':'marketer','Social Media':'marketer',

  'Technology':'developer','Programming':'developer','Web Development':'developer',
};
// Returns the most-represented CAREER_LABELS entry for a set of skill strings
function skillsToCareerLabel(skills){
  const tally={};
  skills.forEach(s=>{const id=SKILL_TO_LABEL[s];if(id)tally[id]=(tally[id]||0)+1;});
  const top=Object.entries(tally).sort((a,b)=>b[1]-a[1])[0];
  return top?CAREER_LABELS.find(c=>c.id===top[0]):null;
}

function approvedByUser(uid){
  return S.tasks.flatMap(t=>t.submissions.filter(s=>s.userId===uid&&s.status==='approved').map(()=>t));
}

function taskStatus(t){
  const active=t.submissions.filter(s=>s.status!=='rejected');
  if(active.some(s=>s.status==='pending_review'))return 'review';
  if(active.length>=t.capacity)return 'full';
  if(active.length>0)return 'claimed';
  return 'open';
}
function mySubmission(t){return t.submissions.find(s=>s.userId===S.uid)}
function members(){return S.users.filter(u=>u.role==='member')}

function awardBadges(uid){
  const u=getUser(uid);if(!u)return[];
  const earned=[];const done=approvedByUser(uid);
  const cats=new Set(done.flatMap(t=>t.skills.map(s=>SKILL_CATS[s]).filter(Boolean)));
  const give=(id,cond)=>{if(cond&&!u.badges.includes(id)){u.badges.push(id);earned.push(id)}};
  give('first-step',done.length>=1);
  give('go-getter',done.length>=3);
  give('team-player',S.tasks.some(t=>t.submissions.some(s=>s.userId===uid)));
  give('all-rounder',cats.size>=3);
  give('researcher',done.some(t=>t.cat==='research'));
  give('creative',done.some(t=>t.cat==='creative'));
  if(u.role==='officer')give('leader',u.tasksApproved>=5);
  give('resume-ready',u.portfolioEntries.length>0);
  return earned;
}

function toast(msg,type=''){
  const w=document.getElementById('toasts');
  const d=document.createElement('div');
  d.className=`toast ${type}`;
  const ico=type==='ok'?'✅':type==='err'?'❌':'ℹ️';
  d.textContent=ico+' '+msg;
  w.appendChild(d);
  setTimeout(()=>{d.style.opacity='0';d.style.transform='translateY(10px)';d.style.transition='all .3s';setTimeout(()=>d.remove(),300)},3200);
}

// ── TASK CARD (SQUARE) ────────────────────────────────
function taskCard(task,idx=0){
  const u=me();const cat=CAT[task.cat]||CAT.general;
  const st=taskStatus(task);const mySub=mySubmission(task);
  const active=task.submissions.filter(s=>s.status!=='rejected');
  const spotsLeft=task.capacity-active.length;

  let stChip='',action='';
  if(st==='open')stChip=`<span class="s-chip s-open">Open</span>`;
  else if(st==='claimed')stChip=`<span class="s-chip s-claimed">In Progress</span>`;
  else if(st==='review')stChip=`<span class="s-chip s-review">Needs Review</span>`;
  else if(st==='approved')stChip=`<span class="s-chip s-approved">Done</span>`;
  else stChip=`<span class="s-chip s-full">Full</span>`;

  if(u.role==='member'){
    if(!mySub&&st==='open')action=`<button class="btn btn-teal btn-sm" onclick="claimTask('${task.id}')">Claim</button>`;
    else if(mySub?.status==='claimed')action=`<button class="btn btn-pri btn-sm" onclick="openModal('submit','${task.id}')">Submit</button>`;
    else if(mySub?.status==='pending_review')action=`<button class="btn btn-ghost btn-sm" disabled>⏳ In Review</button>`;
    else if(mySub?.status==='approved')action=`<button class="btn btn-ghost btn-sm" onclick="openModal('portfolio','${task.id}')">+ Portfolio</button>`;
  }else if(u.role==='officer'){
    const reviewCount=task.submissions.filter(s=>s.status==='pending_review').length;
    if(reviewCount)action=`<button class="btn btn-pri btn-sm" onclick="openModal('review','${task.id}')">Review (${reviewCount})</button>`;
    else if(st==='open')action=`<button class="btn btn-danger btn-sm" onclick="delTask('${task.id}')">Delete</button>`;
  }

  const feedbackBox=mySub?.officerFeedback&&(mySub.status==='pending_review'||mySub.status==='approved')
    ?`<div class="review-feedback-box">💬 <strong>Officer feedback:</strong> ${mySub.officerFeedback}</div>`
    :'';
  return`<div class="tcard" id="tcard-${task.id}" style="animation-delay:${Math.min(idx*60,480)}ms">
  <div class="tcard-top" style="background:${cat.c}"></div>
  <div class="tcard-body">
    <div class="tcard-cat-row">
      <span class="tcard-cat-icon">${cat.icon}</span>
      <span class="tcard-cat-lbl" style="color:${cat.c}">${cat.lbl}</span>
      <span style="margin-left:auto">${stChip}</span>
    </div>
    <div class="tcard-title">${task.title}</div>
    <div class="tcard-desc">${task.desc}</div>
    <div class="tcard-skills">${task.skills.map(s=>`<span class="sk-tag">${s}</span>`).join('')}</div>
    ${(u.role==='member'&&!mySub&&task.skills.length)?`<div style="font-size:11px;color:var(--stone);margin:5px 0 2px">${(()=>{const cl=skillsToCareerLabel(task.skills);return cl?`<span style="font-size:12px;font-weight:700;color:var(--forest)">→ ${cl.icon} ${cl.label} path</span>`:`<span>→ +${task.skills.length} skill${task.skills.length!==1?'s':''}</span>`;})()}</div>`:''}
    ${feedbackBox}
    <div class="tcard-footer">
      <div>
        ${task.capacity>1?`<span class="tcard-cap">👥 ${spotsLeft}/${task.capacity} spots</span>`:''}
      </div>
      ${action}
    </div>
  </div>
</div>`;
}

// ── RENDER TASKS VIEW ─────────────────────────────────
function renderTasks(){
  const u=me();const f=S.filter;
  let tasks=[...S.tasks].sort((a,b)=>b.createdAt-a.createdAt);
  const pendingN=S.tasks.reduce((n,t)=>n+t.submissions.filter(s=>s.status==='pending_review').length,0);

  if(u.role==='member'){
    if(f==='open')tasks=tasks.filter(t=>taskStatus(t)==='open');
    else if(f==='mine')tasks=tasks.filter(t=>t.submissions.some(s=>s.userId===u.id));
  }else{
    if(f==='review')tasks=tasks.filter(t=>t.submissions.some(s=>s.status==='pending_review'));
    else if(f==='open')tasks=tasks.filter(t=>taskStatus(t)==='open');
    else if(f==='approved')tasks=tasks.filter(t=>t.submissions.some(s=>s.status==='approved'));
  }

  const filters=u.role==='member'
    ?[['all','All'],['open','Open'],['mine','My Tasks']]
    :[['all','All'],[`review`,`⏳ Review${pendingN?` (${pendingN})`:''}`],['open','Open'],['approved','Approved']];

  return`<div class="page-hdr">
  <div><div class="page-title">Tasks</div><div class="page-sub">${u.role==='member'?'Claim tasks to build real skills.':'Create tasks and review submissions.'}</div></div>
  ${u.role==='officer'?`<button class="btn btn-pri" onclick="openModal('createTask')">+ Create Task</button>`:''}
</div>
<div class="filter-row">${filters.map(([k,l])=>`<button class="ftab ${f===k?'active':''}" onclick="setF('${k}')">${l}</button>`).join('')}</div>
${tasks.length?`<div class="task-grid">${tasks.map((t,i)=>taskCard(t,i)).join('')}</div>`:`<div class="empty"><div class="empty-ico">📭</div><div class="empty-ttl">Nothing here</div><div>Try a different filter.</div></div>`}`;
}

function submitTaskRequest(){
  const area=document.getElementById('reqArea')?.value;
  const comment=document.getElementById('reqComment')?.value?.trim();
  if(!area||!comment){toast('Fill in both fields','err');return}
  const req={id:Date.now().toString(),userId:S.uid,area,comment,status:'pending',createdAt:new Date().toLocaleDateString()};
  S.taskRequests.push(req);
  document.getElementById('reqArea').value='';
  document.getElementById('reqComment').value='';
  toast('Request submitted!','ok');
  render();
}

  else if(m==='userProfile'){

    else{

    const topSkills=u.skills.slice(0,3);

    const bulletPreview=S.aiResumeBullets&&S.aiResumeBullets!=='loading'
      ?S.aiResumeBullets.split('\n').filter(l=>l.trim())[0]?.replace(/^[•\-\*\d\.]+\s*/,'')

      const ms=members();
      const totalMembers=ms.length;
      const tasksApproved=S.tasks.flatMap(t=>t.submissions.filter(s=>s.status==='approved')).length;
      const eventsCreated=S.attendance.events.filter(e=>e.createdBy===u.id).length;

      html=`<div class="modal-hdr">

            <div style="font-size:10px;color:var(--stone);text-transform:uppercase;letter-spacing:.3px">Approved</div>
          </div>
          <div style="background:var(--cream);border-radius:var(--rsm);padding:12px;text-align:center;border:1px solid var(--sand)">
            <div style="font-size:22px;font-weight:900;color:var(--sky)">${eventsCreated}</div>
            <div style="font-size:10px;color:var(--stone);text-transform:uppercase;letter-spacing:.3px">Events</div>
          </div>
          <div style="background:var(--cream);border-radius:var(--rsm);padding:12px;text-align:center;border:1px solid var(--sand)">
            <div style="font-size:22px;font-weight:900;color:var(--terra)">${participationRate}%</div>
            <div style="font-size:10px;color:var(--stone);text-transform:uppercase;letter-spacing:.3px">Participation</div>

            <div style="font-size:10px;color:var(--stone);text-transform:uppercase;letter-spacing:.3px">Retention</div>
          </div>
        </div>
        <div style="font-size:12px;color:var(--stone);background:#FFF8E7;border:1px solid #FDE68A;border-radius:var(--rsm);padding:8px 12px;margin-bottom:14px;font-size:11px">🔒 Passwords are securely hashed and cannot be viewed. Use 'Delete Account' in Users tab to remove a user.</div>

        <div style="overflow-x:auto">
          <table style="width:100%;border-collapse:collapse;font-size:12px">

            <tbody>
              ${ms.map(m=>{

                const editing=profileEditStates[m.id];

                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>
      <div class="modal-ftr"><button class="btn btn-ghost" onclick="closeModal()">Close</button></div>`;
    } else {
      // Member profile
      html=`<div class="modal-hdr">
        <div>
          <div class="modal-ttl">${u.name}</div>
          ${careerL?`<div style="font-size:12px;color:var(--stone);margin-top:3px">${careerL.icon} ${careerL.label}</div>`:`<div style="font-size:12px;color:var(--stone);margin-top:3px">${u.role}</div>`}
        </div>
        <button class="close-btn" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px">
          <div style="background:var(--cream);border-radius:var(--rsm);padding:14px;text-align:center;border:1px solid var(--sand)">

          <div style="font-size:12px;font-weight:800;color:var(--stone);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px">Tasks Completed</div>

          ${careerL?`<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;background:#E8F0EB;border-radius:var(--rsm);padding:10px 14px"><span style="font-size:20px">${careerL.icon}</span><div style="font-weight:700;color:var(--forest)">${careerL.label}</div></div>`:'<div style="font-size:13px;color:var(--stone);font-style:italic;margin-bottom:10px">No career identity set — visit Career Ready</div>'}
          ${topSkills.length?`<div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px">${topSkills.map(s=>`<span class="sk-tag">${s}</span>`).join('')}</div>`:''}
          ${bulletPreview?`<div style="background:var(--cream2);border-left:3px solid var(--forest);border-radius:var(--rsm);padding:10px 14px;font-size:12px;line-height:1.6;color:var(--ink)">${bulletPreview}</div>`:`<div style="font-size:12px;color:var(--stone);font-style:italic">Visit Career Ready to generate AI resume bullets</div>`}
        </div>
      </div>
      <div class="modal-ftr"><button class="btn btn-ghost" onclick="closeModal()">Close</button><button class="btn btn-pri" onclick="closeModal();nav('resume')">Career Ready →</button></div>`;
    }
  }

  return`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
}

// ── MAIN RENDER ───────────────────────────────────────
function render(){
  const app=document.getElementById('app');
  if(!S.uid){app.innerHTML=renderLogin();document.getElementById('aiFab').style.display='none';return}
  document.getElementById('aiFab').style.display='flex';
  app.innerHTML=`${renderTopbar()}<div class="app-body"><div class="main"><div class="main-inner">${renderView()}</div></div></div>${renderModal()}`;
  animateStatVals();
}

function animateStatVals(){
  document.querySelectorAll('.stat-val').forEach(el=>{
    const target=parseInt(el.textContent,10);
    if(isNaN(target)){return}
    const dur=500;const start=performance.now();
    function step(now){
      const p=Math.min((now-start)/dur,1);
      const eased=1-Math.pow(1-p,3);
      el.textContent=Math.round(eased*target);
      if(p<1)requestAnimationFrame(step);else el.textContent=target;
    }
    requestAnimationFrame(step);
  });
}

function getEventStatus(ev){
  const today=new Date();today.setHours(0,0,0,0);
  if(ev.is_open===false){return'past';}
  let evDate=null;
  if(ev.date){try{evDate=new Date(ev.date);if(isNaN(evDate))evDate=null;}catch(e){evDate=null;}}
  if(evDate&&evDate<today){return'past';}
  if(ev.is_open===true){return'ongoing';}
  if(evDate){const diffMs=evDate-today;const diffDays=diffMs/(1000*60*60*24);if(diffDays<=7)return'ongoing';}
  return'upcoming';
}

function markAttendance(evId,userId){
  if(!S.attendance.records[evId])S.attendance.records[evId]=[];
  if(S.attendance.records[evId].includes(userId)){toast('Already marked','');return}
  S.attendance.records[evId].push(userId);
  const u=getUser(userId)||S.usersList.find(u=>u.id===userId);
  toast(`${u?u.name.split(' ')[0]:'Member'} marked as attended ✅`,'ok');
  render();
}

function importAttendanceCSV(event,evId){
  const file=event.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const text=e.target.result;
    const lines=text.split(/\r?\n/).filter(l=>l.trim());
    if(!lines.length){toast('Empty CSV file','err');return}
    // Parse header row
    const headers=lines[0].split(',').map(h=>h.trim().replace(/"/g,'').toLowerCase());
    const nameIdx=headers.findIndex(h=>['name','full name','student name','student','fullname'].includes(h));
    if(nameIdx<0){toast('Could not find a Name column in CSV','err');return}
    let matched=0;
    for(let i=1;i<lines.length;i++){
      const cols=lines[i].split(',').map(c=>c.trim().replace(/"/g,''));
      const rawName=cols[nameIdx];
      if(!rawName)continue;
      const lname=rawName.toLowerCase();
      const user=S.users.find(u=>u.name.toLowerCase()===lname)||S.usersList.find(u=>u.name&&u.name.toLowerCase()===lname);
      if(user){
        if(!S.attendance.records[evId])S.attendance.records[evId]=[];
        if(!S.attendance.records[evId].includes(user.id)){
          S.attendance.records[evId].push(user.id);
          matched++;
        }
      }
    }
    toast(`Imported ${matched} attendee${matched!==1?'s':''}${matched<lines.length-1?` (${lines.length-1-matched} not found)`:''}`,matched>0?'ok':'');
    render();
  };
  reader.readAsText(file);
}

async function distributeEventWithAI(evId){
  const ev=S.clubEvents.find(e=>e.id===evId);
  if(!ev||!ev.tasks.length){toast('Add tasks to the event first','err');return}
  const memberList=members();
  if(!memberList.length){toast('No members to assign yet','err');return}

  S.aiDistribution={evId,loading:true,tasks:[]};
  render();

  const taskLines=ev.tasks.map((t,i)=>`${i}|${t.id}|"${t.title}" — needs: ${t.skills.join(', ')||'general'}, competency: ${t.competency||'general'}, slots: ${t.slots}`).join('\n');
  const memberLines=memberList.map(m=>`"${m.name}": skills=[${m.skills.join(', ')||'none'}], completed=${approvedByUser(m.id).length} tasks`).join('\n');

  try{
    const res=await callGroq(
      'You are assigning club event tasks to members. Return ONLY a valid JSON array. No explanation.',
      `Event: "${ev.title}"\n\nTasks (index|id|details):\n${taskLines}\n\nMembers:\n${memberLines}\n\nFor each task, suggest the 2-3 best-fit members. Spread work across different members. Return:\n[{"taskId":"<exact task id from above>","taskTitle":"<title>","suggestions":[{"name":"<exact member name>","reason":"<10 words max>"},...]}]`,
      [],
      800
    );

    let parsed;
    try{const m=res.match(/\[[\s\S]*\]/);parsed=JSON.parse(m?m[0]:res);}
    catch(e){throw new Error('Could not parse AI response');}

    const tasks=parsed.map(item=>{
      const task=ev.tasks.find(t=>t.id===item.taskId)||ev.tasks.find(t=>t.title===item.taskTitle);
      if(!task)return null;
      const suggestions=(item.suggestions||[]).map(s=>{
        const user=memberList.find(m=>m.name===s.name)||memberList.find(m=>m.name.toLowerCase()===s.name.toLowerCase());
        if(!user)return null;
        return{userId:user.id,name:user.name,reason:s.reason||''};
      }).filter(Boolean);
      return{taskId:task.id,taskTitle:task.title,suggestions};
    }).filter(Boolean);

    if(!tasks.length)throw new Error('No assignments generated');
    S.aiDistribution={evId,loading:false,tasks};
    toast(`InvoAI suggested assignments for ${tasks.length} task${tasks.length!==1?'s':''}!`,'ok');
  }catch(e){
    S.aiDistribution=null;
    toast('Could not generate assignments: '+e.message,'err');
  }
  render();
}

  const reader=new FileReader();
  reader.onload=e=>{
    S.pendingFile={name:file.name,size:(file.size/1024).toFixed(0)+' KB',dataUrl:e.target.result};
    const lbl=document.getElementById('fileLbl');
    if(lbl)lbl.innerHTML=`✅ <strong>${file.name}</strong> (${S.pendingFile.size})`;
  };
  reader.readAsDataURL(file);
}

      `Task: ${task.title}\nDescription: ${task.desc}\nStudent submission: ${S.submitDesc}\nMetrics provided:\n- ${m0||'not provided'}\n- ${m1||'not provided'}\n- ${m2||'not provided'}\n\nGenerate EXACTLY 3 resume bullets. Each bullet must: start with a strong action verb, include specific numbers/percentages from the metrics if provided, be 1-2 sentences max.\nReturn as JSON array: ["bullet1","bullet2","bullet3"]`,
      [],
      400
    );
    let bullets;
    try{const match=res.match(/\[[\s\S]*\]/);bullets=JSON.parse(match?match[0]:res);}catch(e){bullets=[res];}
    if(!Array.isArray(bullets))bullets=[String(bullets)];
    sub.resumeBullets=bullets.slice(0,3);
  }catch(e){
    sub.resumeBullets=[];
  }

  // Mark as pending_review
  sub.status='pending_review';
  sub.work=S.submitDesc;
  sub.fileName=S.pendingFile?.name||null;
  sub.fileDataUrl=S.pendingFile?.dataUrl||null;
  sub.docLink=S.submitDocLink||null;
  sub.aiSkills=confirmedSkills;

  // Save to backend
  const u=me();
  if(u.id){
    try{
      const r=await fetch(`${API_URL}/activities/`,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({user_id:u.id,title:task.title,raw_submission:S.submitDesc,category:task.cat})});
      if(r.ok){
        const data=await r.json();
        const ai=data.ai_metrics;
        if(ai){
          const backendSkills=[...(ai.competency_tags||[]),...(ai.linkedin_keywords||[])];
          sub.aiSkills=[...new Set([...sub.aiSkills,...backendSkills])];
        }
      }
    }catch(e){}
  }

  S.pendingFile=null;S.pendingAISkills=[];S.submitDocLink=null;
  closeModal();
  toast('Submitted with resume bullets! Officer will review soon. 🚀','ok');
}

async function generateEventBulletsAndSubmit(evId,taskId){
  const m0=document.getElementById('evmetric0')?.value?.trim()||'not provided';
  const m1=document.getElementById('evmetric1')?.value?.trim()||'not provided';
  const m2=document.getElementById('evmetric2')?.value?.trim()||'not provided';
  const ev=S.clubEvents.find(e=>e.id===evId);
  const task=ev?.tasks.find(t=>t.id===taskId);
  if(!task)return;
  const confirmedSkills=[...document.querySelectorAll('.ai-skill-chip:not(.off)')].map(c=>c.textContent.trim());
  const questions=S.submitAnalysis?.metrics_questions||[];

  toast('InvoAI is writing your resume bullets…','');
  let bullets=[];
  try{
    const res=await callGroq(
      'You are a professional resume writer for college students. Generate EXACTLY 3 powerful resume bullets. Return ONLY a JSON array of 3 strings. No markdown.',
      `Event: "${ev.title}"\nTask: "${task.title}"\nRole/contribution: ${S.submitDesc}\n\n${questions[0]||'Impact'}: ${m0}\n${questions[1]||'Outcome'}: ${m1}\n${questions[2]||'Effort'}: ${m2}\n\nSkills demonstrated: ${confirmedSkills.join(', ')||'teamwork, communication'}\n\nWrite EXACTLY 3 resume bullets. Each must: start with a strong past-tense action verb, include specific metrics from above, show professional competency and real impact. Be concise (1-2 sentences each).\nReturn as JSON array: ["bullet1","bullet2","bullet3"]`,
      [],500
    );
    try{const match=res.replace(/```json|```/g,'').trim().match(/\[[\s\S]*\]/);bullets=JSON.parse(match?match[0]:res);}
    catch{bullets=[res.split('\n').filter(l=>l.trim())[0]];}
    if(!Array.isArray(bullets))bullets=[String(bullets)];
    bullets=bullets.slice(0,3);
  }catch(e){bullets=['Contributed to '+task.title+' for '+ev.title];}

  if(!task.submissions)task.submissions=[];
  const existing=task.submissions.find(s=>s.userId===S.uid);
  const submission={userId:S.uid,work:S.submitDesc,fileName:S.pendingFile?.name||null,docLink:S.submitDocLink||null,aiSkills:confirmedSkills,resumeBullets:bullets,status:'pending_review',submittedAt:new Date().toLocaleDateString()};
  if(existing){Object.assign(existing,submission);}else{task.submissions.push(submission);}

  // Also save to backend for Career Ready tracking
  const u=me();
  try{
    await fetch(`${API_URL}/activities`,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({user_id:u.id,title:task.title+' — '+ev.title,raw_submission:S.submitDesc,category:task.competency||'general'})});
  }catch(e){}

  S.pendingFile=null;S.submitDocLink=null;
  closeModal();
  toast('Submitted! InvoAI built your resume bullets. Officer will review soon. 🚀','ok');
}

function approveSub(taskId,userId){
  const t=S.tasks.find(t=>t.id===taskId);
  const sub=t.submissions.find(s=>s.userId===userId);
  const claimer=getUser(userId);const officer=me();
  const feedback=document.getElementById('reviewFeedback')?.value||'';
  sub.status='approved';
  if(feedback)sub.officerFeedback=feedback;
  // merge task skills + AI skills, deduplicate
  const allSkills=[...new Set([...t.skills,...(sub.aiSkills||[])])];
  allSkills.forEach(s=>{if(!claimer.skills.includes(s))claimer.skills.push(s)});
  officer.tasksApproved=(officer.tasksApproved||0)+1;
  playApproveSuccess(()=>{
    closeModal();
    toast(`Approved! ${claimer.name.split(' ')[0]} earned ${allSkills.length} skill(s).`, 'ok');
  });
}

  }).map(r=>r.title);
  if(isDistribute){
    return`You are InvoAI, an officer assistant for a community college club. You help officers distribute event tasks among members based on their skills and competency areas (marketing, finance, tech, leadership, research, creative, community). Aim to cover different competency areas and maximize the number of members involved. Be specific, fair, and concise — use a clear bullet-point assignment list. Format: "• [Task]: [Member name] — because [1 sentence reason]". Keep it short and actionable.`;
  }

  return`You are InvoAI, the smart assistant for InvolvED — a college club management app. Be short, direct, and helpful. Never give long paragraphs. Use 1-3 sentences max per response.

Pages available: Home (dashboard), Events (club events and tasks), Career Ready (resume bullets and skills), Add Me (request tasks), Members (officer only), Users (officer only).

Current club data will be provided in context. When a student asks about a specific task or event that exists in the data, ALWAYS end your response with a JSON navigation hint like: {"nav":"events","label":"View Events"} or {"nav":"addme","label":"Request This Skill"}.

When an officer asks to create an event, gather info step by step: ask for event name first, then description, then date, then skills needed. After all 4 collected, respond with: {"action":"createEvent","data":{"title":"...","desc":"...","date":"...","skills":[...]}}

When a task is not available, suggest: {"nav":"addme","label":"Submit an Add Me Request"}.

Student: ${u.name} (${u.role})
Club Skills: ${u.skills.join(', ')||'none yet'}
LinkedIn Keywords: ${liSkills.join(', ')||'none yet'}
Internship Roles Qualified For: ${matches.join(', ')||'none yet — keep building skills!'}

function appendAIMsg(role,content,loading=false){
  const msgs=document.getElementById('aiMsgs');if(!msgs)return;
  const d=document.createElement('div');
  d.className=`ai-msg ${role}`;d.id=loading?'aiLoading':'';
  d.innerHTML=role==='ai'?`<div class="ai-msg-lbl">InvoAI</div>${content}`:content;
  msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;
}

function parseAINavHints(content){
  let displayContent=content;
  let extraHTML='';
  // Find all JSON objects in the response
  const jsonMatches=content.match(/\{[^{}]+\}/g);
  if(jsonMatches){
    for(const jStr of jsonMatches){
      try{
        const hint=JSON.parse(jStr);
        if(hint.nav){
          extraHTML+=`<div style="margin-top:8px"><button onclick="toggleAI();nav('${hint.nav}')" class="btn btn-teal btn-sm" style="margin-top:6px">${hint.label||'Go →'}</button></div>`;
          displayContent=displayContent.replace(jStr,'').trim();
        } else if(hint.action==='createEvent'&&hint.data){
          const dataStr=JSON.stringify(hint.data).replace(/"/g,'&quot;');
          extraHTML+=`<div style="margin-top:8px"><button onclick="openModal('createClubEvent',JSON.parse(this.dataset.d))" data-d='${JSON.stringify(hint.data).replace(/'/g,"&#39;")}' class="btn btn-pri btn-sm" style="margin-top:6px">Create This Event →</button></div>`;
          displayContent=displayContent.replace(jStr,'').trim();
        }
      }catch(e){}
    }
  }
  return{displayContent,extraHTML};
}

function replaceLastAIMsg(content){
  const loading=document.getElementById('aiLoading');
  if(loading){
    const{displayContent,extraHTML}=parseAINavHints(content);
    loading.innerHTML=`<div class="ai-msg-lbl">InvoAI</div>${displayContent}${extraHTML}`;
    loading.removeAttribute('id');
  }
  const msgs=document.getElementById('aiMsgs');if(msgs)msgs.scrollTop=msgs.scrollHeight;
}

function exportToExcel(){
  if(typeof XLSX==='undefined'){toast('SheetJS not loaded — check internet connection','err');return}
  const wb=XLSX.utils.book_new();
  const date=new Date().toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'});

  // ── Members sheet ──
  const memberRows=[
    ['Name','Role','Tasks Completed','Skills','Badges Earned','LinkedIn Keywords']
  ];
  S.users.forEach(u=>{
    const done=approvedByUser(u.id).length;
    const liKw=u.skills.map(s=>LINKEDIN_SKILL_MAP[s]?.liKeyword).filter(Boolean).join(', ');
    memberRows.push([u.name,u.role,done,u.skills.join(', '),u.badges.length,liKw]);
  });
  const wsMembers=XLSX.utils.aoa_to_sheet(memberRows);
  wsMembers['!cols']=[{wch:20},{wch:10},{wch:18},{wch:40},{wch:14},{wch:50}];
  XLSX.utils.book_append_sheet(wb,wsMembers,'Members');

  // ── Tasks sheet ──
  const taskRows=[['Title','Category','Capacity','Status','Skills','Claimed By','Pending Review','Approved By']];
  S.tasks.forEach(t=>{
    const claimed=t.submissions.filter(s=>s.status==='claimed').map(s=>getUser(s.userId)?.name||s.userId).join(', ');
    const pending=t.submissions.filter(s=>s.status==='pending_review').map(s=>getUser(s.userId)?.name||s.userId).join(', ');
    const approved=t.submissions.filter(s=>s.status==='approved').map(s=>getUser(s.userId)?.name||s.userId).join(', ');
    taskRows.push([t.title,CAT[t.cat]?.lbl||t.cat,t.capacity,taskStatus(t),t.skills.join(', '),claimed,pending,approved]);
  });
  const wsTasks=XLSX.utils.aoa_to_sheet(taskRows);
  wsTasks['!cols']=[{wch:36},{wch:14},{wch:10},{wch:10},{wch:36},{wch:20},{wch:20},{wch:20}];
  XLSX.utils.book_append_sheet(wb,wsTasks,'Tasks');

  // ── Attendance sheet ──
  const attRows=[['Event Name','Date','Location','Code','Status','Total Checked In','Attendees']];
  S.attendance.events.forEach(ev=>{
    const checkedIn=S.attendance.records[ev.id]||[];
    const names=checkedIn.map(uid=>getUser(uid)?.name||uid).join(', ');
    attRows.push([ev.name,ev.date,ev.location||'',ev.code,ev.isOpen?'Open':'Closed',checkedIn.length,names]);
  });
  const wsAtt=XLSX.utils.aoa_to_sheet(attRows);
  wsAtt['!cols']=[{wch:28},{wch:14},{wch:14},{wch:10},{wch:8},{wch:18},{wch:40}];
  XLSX.utils.book_append_sheet(wb,wsAtt,'Attendance');

  // ── Club Events sheet ──
  const evRows=[['Event','Date','Task','Task Description','Slots','Filled','Members Signed Up','Skills Needed']];
  S.clubEvents.forEach(ev=>{
    if(!ev.tasks.length){
      evRows.push([ev.title,ev.date,'(no tasks yet)','','','','','']);
    } else {
      ev.tasks.forEach((t,i)=>{
        const signedUp=t.signups.map(uid=>getUser(uid)?.name||uid).join(', ');
        evRows.push([i===0?ev.title:'',i===0?ev.date:'',t.title,t.desc,t.slots,t.signups.length,signedUp,t.skills.join(', ')]);
      });
    }
  });
  const wsEv=XLSX.utils.aoa_to_sheet(evRows);
  wsEv['!cols']=[{wch:24},{wch:14},{wch:32},{wch:44},{wch:6},{wch:6},{wch:28},{wch:36}];
  XLSX.utils.book_append_sheet(wb,wsEv,'Club Events');

  // ── Leaderboard sheet ──
  const lbRows=[['Rank','Name','Role','Tasks Completed','Skills']];
  members().sort((a,b)=>approvedByUser(b.id).length-approvedByUser(a.id).length).forEach((m,i)=>{
    lbRows.push([i+1,m.name,m.role,approvedByUser(m.id).length,m.skills.join(', ')]);
  });
  const wsLb=XLSX.utils.aoa_to_sheet(lbRows);
  wsLb['!cols']=[{wch:6},{wch:20},{wch:10},{wch:18},{wch:40}];
  XLSX.utils.book_append_sheet(wb,wsLb,'Leaderboard');

  // ── Feed sheet ──
  const feedRows=[['Posted By','Role','Type','Message','Reactions','Time']];
  [...S.feed].reverse().forEach(msg=>{
    const author=getUser(msg.userId);
    const reactionSummary=Object.entries(msg.reactions||{}).map(([e,ids])=>`${e}${ids.length}`).join(' ');
    feedRows.push([author?.name||'Unknown',author?.role||'',msg.isAnnouncement?'Announcement':'Post',msg.text,reactionSummary,new Date(msg.ts).toLocaleString()]);
  });
  const wsFeed=XLSX.utils.aoa_to_sheet(feedRows);
  wsFeed['!cols']=[{wch:20},{wch:10},{wch:14},{wch:60},{wch:16},{wch:20}];
  XLSX.utils.book_append_sheet(wb,wsFeed,'Club Feed');

  const fileName=`InvolvED_Export_${date.replace(/,?\s/g,'_')}.xlsx`;
  XLSX.writeFile(wb,fileName);
  toast(`Exported ${fileName} ✅`,'ok');
}

async function aiGenerateEventTasks(){
  const title=document.getElementById('ceTitle')?.value?.trim();
  const desc=document.getElementById('ceDesc')?.value?.trim();
  if(!title&&!desc){toast('Add an event title or description first','err');return}
  // Save form values so they survive the re-render
  S.pendingEventForm={
    title:document.getElementById('ceTitle')?.value||'',
    desc:document.getElementById('ceDesc')?.value||'',
    date:document.getElementById('ceDate')?.value||'',
    color:document.getElementById('ceColor')?.value||'#1E3A2F',
    icon:document.getElementById('ceIcon')?.value||'🎪',
  };
  S.aiEventTasks='loading';render();
  const btn=document.getElementById('aiGenBtn');
  if(btn){btn.disabled=true;btn.textContent='⏳ Generating…';}
  try{
    const prompt=`Event: "${title||'Unnamed Event'}"\nDescription: ${desc||'A club event'}\n\nGenerate 4-6 specific volunteer tasks for members to sign up for. Each task must be concrete and doable by a student. Return ONLY a JSON array, no commentary:\n[{"title":"...","desc":"...","slots":1,"skills":["skill1","skill2"],"competency":"marketing|finance|tech|leadership|research|creative|community"},...]`;
    const res=await callGroq('You are a college club event coordinator. Generate specific, actionable volunteer tasks for events. Return only a valid JSON array. No explanation, no markdown, just the array.',prompt,[], 800);
    let tasks;
    try{
      const cleaned=res.replace(/```json\s*/gi,'').replace(/```\s*/g,'').trim();
      const m=cleaned.match(/\[[\s\S]*\]/);
      tasks=JSON.parse(m?m[0]:cleaned);
    }catch(e){throw new Error('AI returned unexpected format — try again');}
    if(!Array.isArray(tasks)||!tasks.length)throw new Error('No tasks generated');
    S.aiEventTasks=tasks.map(t=>({
      title:String(t.title||t.name||t.task_title||t.task||'Task'),
      desc:String(t.desc||t.description||t.details||t.task_description||''),
      slots:Math.max(1,Math.min(20,parseInt(t.slots||t.capacity||t.num_slots||t.members_needed)||1)),
      skills:Array.isArray(t.skills)?t.skills:Array.isArray(t.required_skills)?t.required_skills:typeof t.skills==='string'?[t.skills]:[],
      competency:t.competency||t.category||t.area||'leadership'
    }));
    toast(`InvoAI created ${S.aiEventTasks.length} tasks! Review and edit below.`,'ok');
  }catch(e){
    S.aiEventTasks=[];
    toast('Could not generate tasks: '+e.message,'err');
  }
  render();
}

// ── GROQ API HELPER (proxied through backend) ─────────
async function callGroq(system,user,history=[],max_tokens=512){
  const messages=[...history,{role:'user',content:user}];
  const res=await fetch(`${API_URL}/chat`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({system,messages,max_tokens})
  });
  if(!res.ok){
    let detail='AI service error';
    try{const e=await res.json();detail=e.detail||detail;}catch{}
    throw new Error(detail);
  }
  const data=await res.json();
  return data.content||'';
}
