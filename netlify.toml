[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/auth/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/chat/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/activities/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/attendance/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/users/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true
